<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Puzzle Playground</title>
<style>
:root{
  --bg1:#fff6e5; --bg2:#e6f2ff; --ink:#26304a; --muted:#68728f; --line:#e2e7f3;
  --verbal:#8338ec; --quant:#118ab2; --nonv:#ef476f; --good:#06a77d; --bad:#e76f51; --gold:#ffb703;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  font-size:18px; line-height:1.4;
}
#app{max-width:880px; margin:0 auto; padding:16px 16px 60px}
h1,h2,h3,p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid #26304a; outline-offset:2px}

/* header / topbar */
.hero{text-align:center; padding:18px 0 10px}
.hero h1{font-size:clamp(28px,6vw,44px); letter-spacing:-.5px}
.hero p{color:var(--muted); margin-top:6px}
.starpill{display:inline-flex; gap:6px; align-items:center; background:#fff; border:2px solid var(--line); border-radius:999px; padding:6px 14px; font-weight:700}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 14px}
.dots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; flex:1}
.dot{width:14px; height:14px; border-radius:50%; background:#d5dbea; border:2px solid #d5dbea}
.dot.now{background:#fff; border-color:var(--ink)}
.dot.ok{background:var(--good); border-color:var(--good)}
.dot.no{background:var(--bad); border-color:var(--bad)}

/* buttons */
.btn{border:0; border-radius:14px; padding:12px 18px; font-weight:700; background:#fff; border:2px solid var(--line); transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--c,var(--ink)); border-color:var(--c,var(--ink)); color:#fff}
.btn.big{padding:14px 26px; font-size:20px}
.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:8px 10px}

/* level picker */
.levels{margin-top:12px; background:#fff; border-radius:22px; padding:16px; box-shadow:0 6px 18px rgba(38,48,74,.08)}
.levels h2{font-size:20px; margin-bottom:10px}
.lvlrow{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.lv{border:3px solid var(--line); background:#fff; border-radius:16px; padding:10px 12px; text-align:left; display:flex; flex-direction:column; gap:2px}
.lv b{font-size:18px}
.lv small{color:var(--muted); font-size:14px; line-height:1.25}
.lv:hover{border-color:var(--l)}
.lv.on{border-color:var(--l); background:var(--l); color:#fff}
.lv.on small{color:rgba(255,255,255,.9)}
.lvl{display:inline-block; border-radius:999px; padding:4px 12px; font-weight:700; font-size:15px; border:2px solid var(--l); color:var(--l); background:#fff; margin-left:6px}

/* home */
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); margin-top:14px}
.bcard{background:#fff; border-radius:22px; padding:18px; border-top:8px solid var(--c); box-shadow:0 6px 18px rgba(38,48,74,.08); display:flex; flex-direction:column; gap:12px}
.bhead{display:flex; gap:12px; align-items:center}
.bemoji{font-size:40px}
.bcard h2{font-size:22px; color:var(--c)}
.bcard p{color:var(--muted); font-size:15px}
.subs{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--c); color:var(--c); background:#fff; border-radius:999px; padding:6px 12px; font-size:15px; font-weight:700}
.chip:hover{background:var(--c); color:#fff}
.mixcard{margin-top:14px; background:#fff; border-radius:22px; padding:18px; display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; box-shadow:0 6px 18px rgba(38,48,74,.08)}
.mixcard h2{font-size:22px}
.mixcard p{color:var(--muted); font-size:15px}
.panel{margin-top:14px; background:rgba(255,255,255,.7); border-radius:18px; padding:14px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.panel label{font-weight:700; font-size:16px}
.segs{display:inline-flex; gap:6px}
.seg,.tog{border:2px solid var(--line); background:#fff; border-radius:12px; padding:6px 14px; font-weight:700; font-size:16px}
.seg.on,.tog.on{background:var(--ink); color:#fff; border-color:var(--ink)}
details.grown{margin-top:14px; background:rgba(255,255,255,.7); border-radius:18px; padding:12px 16px; font-size:16px}
details.grown summary{cursor:pointer; font-weight:700}
details.grown ul{margin:10px 0 0; padding-left:20px; color:var(--muted)}

/* intro */
.introhero{text-align:center; padding:10px 0 4px}
.introhero h1{font-size:clamp(28px,6vw,42px); letter-spacing:-.5px}
.introhero p{color:var(--muted); margin:8px auto 0; max-width:640px}
.isec{margin-top:18px; background:#fff; border-radius:22px; padding:18px 20px; box-shadow:0 6px 18px rgba(38,48,74,.08)}
.isec h2{font-size:22px; margin-bottom:8px}
.isec p{font-size:17px}
.isec .cards{margin-top:10px}
.isec .bcard{box-shadow:none; border:2px solid var(--line); border-top:8px solid var(--c)}
ul.plain{list-style:none; margin:0; padding:0; display:grid; gap:10px; font-size:15px}
ul.plain span{color:var(--muted)}
ol.steps{margin:6px 0 0; padding:0; list-style:none; counter-reset:s; display:grid; gap:10px}
ol.steps li{counter-increment:s; display:flex; gap:12px; align-items:flex-start; font-size:17px}
ol.steps li::before{content:counter(s); flex:none; width:32px; height:32px; border-radius:50%; background:var(--ink); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center}
.legend.flat{box-shadow:none; background:#f6f8fd; margin:8px 0 0}
.buttonsguide{display:grid; gap:8px; margin-top:8px; font-size:17px}
.introcta{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:22px 0 6px}
.about{margin-top:10px}

/* guide */
.guidehead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.legend{background:#fff; border-radius:18px; padding:12px 16px; margin:10px 0; font-size:16px; display:grid; gap:6px}
.gsec{margin-top:16px}
.gsec h2{font-size:22px; margin-bottom:8px}
.gcard{background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:10px; border-left:8px solid var(--c); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; box-shadow:0 4px 12px rgba(38,48,74,.06)}
.gcard h3{font-size:19px; color:var(--c)}
.gcard p{font-size:16px; color:var(--ink)}
.gcard .tip{color:var(--muted); font-size:15px; margin-top:2px}
.gcard .gtxt{flex:1 1 260px}

/* question */
.qcard{background:#fff; border-radius:24px; padding:20px; box-shadow:0 8px 22px rgba(38,48,74,.1); border-top:8px solid var(--c)}
.tag{display:inline-block; background:var(--c); color:#fff; border-radius:999px; padding:4px 14px; font-weight:700; font-size:15px}
.prompt{display:flex; gap:10px; align-items:center; margin:14px 0 6px; font-size:clamp(20px,4vw,26px); font-weight:700}
.speak{border:2px solid var(--line); background:#fff; border-radius:50%; width:44px; height:44px; font-size:20px; flex:none}
.visual{display:flex; flex-direction:column; align-items:center; gap:14px; padding:14px 6px; min-height:120px; justify-content:center}
.pair{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center}
.arrow{font-size:28px; color:var(--muted)}
.pic{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:104px; padding:10px 12px; border:2px solid var(--line); border-radius:18px; background:#fbfcff}
.pic.q{font-size:44px; min-height:104px; border-style:dashed}
.em{font-size:48px; line-height:1.1}
.wd{font-size:15px; color:var(--muted); font-weight:700}
.clue{font-size:clamp(22px,4.5vw,30px); font-weight:700; text-align:center; background:#fbfcff; border:2px solid var(--line); border-radius:18px; padding:18px 22px; max-width:560px}
.trio{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:10px; border:3px dashed var(--c); border-radius:20px}
.equation{font-size:clamp(34px,8vw,54px); font-weight:800; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center}
.box{display:inline-flex; width:1.3em; height:1.3em; border:4px dashed var(--c); border-radius:12px; align-items:center; justify-content:center; color:var(--c)}
.series{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.tile{min-width:62px; padding:10px 8px; text-align:center; font-size:34px; font-weight:800; border-radius:14px; background:#eaf6fb; border:2px solid #b9dff0}
.tile.ask{background:#fff; border:3px dashed var(--c); color:var(--c)}
.grp{display:flex; flex-wrap:wrap; gap:2px; font-size:30px; max-width:210px; justify-content:center; padding:8px 12px; border:2px solid var(--line); border-radius:16px; background:#fbfcff; min-width:70px}
.story{font-size:clamp(20px,4vw,26px); font-weight:700; text-align:center; max-width:600px}
.items{font-size:34px; text-align:center; letter-spacing:2px}
.mgrid{display:grid; grid-template-columns:repeat(2,auto); gap:8px; padding:8px; background:#f3f5fb; border-radius:18px}
.cell{background:#fff; border:2px solid var(--line); border-radius:14px; display:flex; align-items:center; justify-content:center; min-width:96px; min-height:96px}
.cell.q{font-size:44px; color:var(--c); border:3px dashed var(--c)}
.mgrid3{display:grid; grid-template-columns:repeat(3,auto); gap:6px; padding:8px; background:#f3f5fb; border-radius:18px}
.mgrid3 .cell{min-width:78px; min-height:78px}
.clock{font-variant-numeric:tabular-nums}
.clock.low{background:#fdeee9; border-color:var(--bad); color:var(--bad)}
.qmap{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:0 0 12px}
.qm{width:38px; height:38px; border-radius:10px; border:2px solid var(--line); background:#fff; font-weight:800}
.qm.done{background:#e3e9fb; border-color:#9fb0e6}
.qm.now{outline:3px solid var(--ink); outline-offset:1px}
.opt.sel{border-color:var(--ink); background:#eef1fb}
.opt.static{pointer-events:none}
.badge{position:absolute; top:6px; right:8px; font-size:12px; font-weight:800}
.navrow{display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; margin-top:16px}
.confirm{margin-top:14px; background:#fff8e1; border-left:6px solid var(--gold); border-radius:12px; padding:12px 14px; font-size:17px}
.setup .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px}
.setup .row > label{font-weight:700; min-width:90px}
details.rev{margin-top:10px; background:#fff; border:2px solid var(--line); border-radius:16px; padding:10px 14px; text-align:left}
details.rev summary{cursor:pointer; font-weight:700; font-size:16px}
details.rev .why{margin-top:10px; background:#f6f8fd; border-radius:12px; padding:10px 12px; font-size:16px}
.seqrow{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.seqrow .cell{min-width:72px; min-height:72px}
.caption{color:var(--muted); font-size:15px; text-align:center}

.options{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:8px}
.opt{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:116px; padding:12px 8px; border-radius:18px; background:#fff; border:3px solid var(--line); transition:transform .08s, border-color .1s}
.opt:hover:not([disabled]){border-color:var(--c); transform:translateY(-2px)}
.opt .key{position:absolute; top:6px; left:8px; font-size:12px; font-weight:800; color:var(--muted)}
.opt .num{font-size:42px; font-weight:800}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good); background:#e8faf3; animation:bounce .5s}
.opt.wrong{border-color:var(--bad); background:#fdeee9}
.opt.dim{opacity:.5}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

.hintbox{margin-top:14px; background:#fff8e1; border-left:6px solid var(--gold); border-radius:12px; padding:10px 14px; font-size:17px}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center}
.fb{margin-top:16px; border-radius:16px; padding:14px 16px}
.fb.ok{background:#e8faf3; border:2px solid var(--good)}
.fb.no{background:#fff2ec; border:2px solid var(--bad)}
.fb h3{font-size:22px; margin-bottom:4px}
.fb .streak{font-weight:700; color:var(--bad)}

/* results */
.results{background:#fff; border-radius:24px; padding:24px; text-align:center; box-shadow:0 8px 22px rgba(38,48,74,.1)}
.results h2{font-size:clamp(26px,6vw,38px)}
.bigscore{font-size:60px; font-weight:800; margin:6px 0}
.starsrow{font-size:34px; letter-spacing:4px}
.break{max-width:480px; margin:18px auto 0; text-align:left}
.break h3{font-size:16px; color:var(--muted); margin:14px 0 2px; text-transform:uppercase; letter-spacing:.5px}
.brow{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:16px}
.brow .lbl{flex:1 1 150px}
.bar{flex:2 1 140px; height:14px; background:#e8ecf6; border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--good)}
.brow .n{width:44px; text-align:right; font-weight:700}
.rbtns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:22px}
@media (max-width:520px){ body{font-size:16px} .em{font-size:40px} .opt{min-height:100px} }
</style>
</head>

    why = `All three are ${KIND_PLURAL[K]}, even though the colors and sizes are different. So the answer is another ${K}.`;
  } else if (mode === 'color') {
    const C = cols[0], oc = cols.slice(1);
    items = [{ kind: ks[0], color: C }, { kind: ks[1], color: C, small: true }, { kind: ks[2], color: C }];
    ans = { kind: ks[3], color: C };
    wrong = [{ kind: ks[3], color: oc[0] }, { kind: ks[0], color: oc[1] }, { kind: ks[4], color: oc[2] }];
    why = 'All three are the same color, even though the shapes are different. So the answer is the shape with that same color.';
  } else if (mode === 'size') {
    items = [{ kind: ks[0], color: cols[0], small: true }, { kind: ks[1], color: cols[1], small: true }, { kind: ks[2], color: cols[2], small: true }];
    ans = { kind: ks[3], color: cols[3], small: true };
    wrong = [{ kind: ks[3], color: cols[3] }, { kind: ks[0], color: cols[4] }, { kind: ks[4], color: cols[5] }];
    why = 'All three shapes are small. So the answer is the small shape.';
    hint = 'Look at how big each shape is compared with the box around it.';
  } else if (mode === 'count') {
    items = [{ kind: ks[0], color: cols[0], count: 2 }, { kind: ks[1], color: cols[1], count: 2 }, { kind: ks[2], color: cols[2], count: 2 }];
    ans = { kind: ks[3], color: cols[3], count: 2 };
    wrong = [{ kind: ks[3], color: cols[3] }, { kind: ks[0], color: cols[4], count: 3 }, { kind: ks[1], color: cols[5] }];
    why = 'All three pictures have two shapes in them. So the answer is the picture with two shapes.';
    hint = 'Count how many shapes are inside each box.';
  } else if (mode === 'fill') {
    items = [{ kind: ks[0], color: '#ffffff' }, { kind: ks[1], color: '#ffffff' }, { kind: ks[2], color: '#ffffff' }];
    ans = { kind: ks[3], color: '#ffffff' };
    wrong = [{ kind: ks[3], color: cols[0] }, { kind: ks[0], color: cols[1] }, { kind: ks[4], color: cols[2] }];
    why = 'All three shapes are empty inside, with no color. So the answer is the empty shape.';
    hint = 'Look inside the shapes. Are they colored in, or empty?';
  } else if (mode === 'both') {
    const K = ks[0], C = cols[0];
    items = [{ kind: K, color: C }, { kind: K, color: C, small: true }, { kind: K, color: C, count: 2 }];
    ans = { kind: K, color: C, count: 3 };
    wrong = [{ kind: K, color: cols[1] }, { kind: ks[1], color: C }, { kind: ks[2], color: cols[2] }];
    why = `All three are ${COLORNAME[C]} ${KIND_PLURAL[K]}. The answer has to be a ${COLORNAME[C]} ${K} too.`;
    hint = 'Two things are the same in every box. Find both: the shape and the color.';
  } else if (mode === 'countkind') {
    const K = ks[0];
    items = [{ kind: K, color: cols[0], count: 2 }, { kind: K, color: cols[1], count: 2 }, { kind: K, color: cols[2], count: 2 }];
    ans = { kind: K, color: cols[3], count: 2 };
    wrong = [{ kind: K, color: cols[3], count: 3 }, { kind: ks[1], color: cols[3], count: 2 }, { kind: K, color: cols[4] }];
    why = `All three pictures show two ${KIND_PLURAL[K]}. So the answer shows two ${KIND_PLURAL[K]} too.`;
    hint = 'Two things are the same in every box. Find both: the shape and how many.';
  } else {
    const C = cols[0], oc = cols.slice(1);
    items = [{ kind: ks[0], color: C, small: true }, { kind: ks[1], color: C, small: true }, { kind: ks[2], color: C, small: true }];
    ans = { kind: ks[3], color: C, small: true };
    wrong = [{ kind: ks[3], color: C }, { kind: ks[3], color: oc[0], small: true }, { kind: ks[0], color: oc[1] }];
    why = `All three are small and ${COLORNAME[C]}. The answer has to be small and ${COLORNAME[C]} too.`;
    hint = 'Two things are the same in every box. Check the size and the color.';
  }
  return makeQ({
    battery: 'nonverbal', sub: 'Shape Families',
    say: 'These three shapes belong together. Which shape belongs with them?',
    prompt: 'Which shape belongs with these three?',
    visual: `<div class="trio" style="--c:var(--nonv)">${items.map(o => `<div class="cell">${fig(o)}</div>`).join('')}</div>`,
    options: [ans, ...wrong].map(o => fig(o, 76)), hint, why
  });
}

function buildQueue(spec, o) {
  o = o || {};
  const len = o.len || S.settings.len, lvl = o.level !== undefined ? o.level : S.settings.level;
  let gens;
  if (spec.sub) gens = [BAT[spec.bat].subs[spec.sub]];
  else if (spec.bat) gens = Object.values(BAT[spec.bat].subs);
  else gens = Object.values(BAT).flatMap(b => Object.values(b.subs));
  gens = shuffle(gens);
  const out = [], seen = new Set(); let g = 0, guard = 0;
  while (out.length < len && guard++ < 600) {
    const L = lvl || 1 + Math.floor(out.length * 3 / len);
    const q = gens[g++ % gens.length].gen(L); q.level = L;
    if (seen.has(q.say) && guard < 500) continue;
    seen.add(q.say); out.push(q);
  }
  return out;
}

function renderResults() {
  const s = S.session, total = s.res.length, ok = s.res.filter(r => r.ok).length, pct = total ? ok / total : 0;
  const msg = pct >= 0.9 ? 'Superstar thinker! 🌟' : pct >= 0.7 ? 'Great job! 🎉' : pct >= 0.4 ? 'Nice work. Keep practicing! 💪' : 'Good effort! Puzzles get easier with practice. 🌱';
  const group = f => { const by = {}; s.res.forEach(r => { const k = f(r); by[k] = by[k] || { ok: 0, n: 0 }; by[k].n++; if (r.ok) by[k].ok++; }); return by; };
  const rowsOf = by => Object.entries(by).map(([k, v]) => `<div class="brow"><span class="lbl">${k}</span><span class="bar"><i style="width:${Math.round(100 * v.ok / v.n)}%"></i></span><span class="n">${v.ok}/${v.n}</span></div>`).join('');
  const byLvl = group(r => r.q.level);
  const lvlRows = Object.keys(byLvl).sort().map(k => `<div class="brow"><span class="lbl">${LV[k].icon} ${LV[k].name}</span><span class="bar"><i style="width:${Math.round(100 * byLvl[k].ok / byLvl[k].n)}%"></i></span><span class="n">${byLvl[k].ok}/${byLvl[k].n}</span></div>`).join('');
  const missed = s.res.filter(r => !r.ok).length;
  const nextUp = (() => {
    const lv = s.opts && s.opts.level !== undefined ? s.opts.level : S.settings.level;
    if (lv === 1 && pct >= 0.8) return 'You are ready for Medium! 🌿';
    if (lv === 2 && pct >= 0.8) return 'Try Hard next! 🌳';
    if (lv === 3 && pct >= 0.8) return 'Hard puzzles look easy for you!';
    return '';
  })();
  $app().innerHTML = `
    <div class="results">
      <h2>${msg}</h2>
      <div class="bigscore">${ok} / ${total}</div>
      <div class="starsrow">${'⭐'.repeat(ok) || '🌱'}</div>
      ${nextUp ? `<p style="margin-top:6px;font-weight:700">${nextUp}</p>` : ''}
      <div class="break">
        <h3>By puzzle type</h3>${rowsOf(group(r => r.q.sub))}
        <h3>By level</h3>${lvlRows}
      </div>
      <p class="caption" style="margin-top:12px">Best streak this round: 🔥 ${s.best}</p>
      <div class="rbtns">
        <button class="btn primary big" style="--c:var(--good)" data-act="again">Play again</button>
        ${missed ? `<button class="btn big" data-act="missed">Retry the ${missed} I missed</button>` : ''}
        <button class="btn big" data-act="home">Home</button>
      </div>
    </div>`;
}

/* ============ practice test mode ============ */
const PACE = { relaxed: 75, standard: 60, quick: 45 };
const PACE_NAME = { relaxed: 'Relaxed', standard: 'Standard', quick: 'Quick' };
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const mins = sec => String(+(sec / 60).toFixed(1));
function testPlan() {
  const per = S.settings.testSize === 'full' ? 4 : 2, perSection = per * 3;
  return { per, perSection, total: perSection * 3, secondsPerSection: perSection * PACE[S.settings.testPace] };
}
function buildTest() {
  const p = testPlan(), lvl = S.settings.level;
  return ['verbal', 'quant', 'nonverbal'].map(bk => {
    const qs = [];
    Object.values(BAT[bk].subs).forEach(sub => {
      const seen = new Set();
      for (let i = 0, guard = 0; i < p.per && guard < 300; guard++) {
        const L = lvl || (p.per === 1 ? 2 : 1 + Math.round(i * 2 / (p.per - 1)));
        const q = sub.gen(L); q.level = L;
        if (seen.has(q.say) && guard < 200) continue;
        seen.add(q.say); qs.push(q); i++;
      }
    });
    return { bat: bk, name: BAT[bk].name, qs, answers: qs.map(() => null), limit: p.secondsPerSection, used: 0, ended: false, timedOut: false };
  });
}
const tsec = () => S.test.secs[S.test.si];
const tq = () => tsec().qs[S.test.qi];
function stopTimer() { if (S.test && S.test.timer) { clearInterval(S.test.timer); S.test.timer = null; } }
function leaveTest() { stopTimer(); S.test = null; }
function testSpeak() { if (S.test && S.test.phase === 'section' && tsec().bat === 'verbal' && S.settings.speak) speak(tq().say); }
function remaining() { return Math.ceil((S.test.endsAt - Date.now()) / 1000); }
function tick() {
  const t = S.test;
  if (!t || t.phase !== 'section') { stopTimer(); return; }
  const r = remaining(), el = document.getElementById('clock');
  if (el) { el.textContent = '⏱️ ' + fmt(r); el.className = 'starpill clock' + (r <= 60 ? ' low' : ''); }
  if (r <= 0) endSection(true);
}
function startTest() {
  stopSpeech(); stopTimer(); S.session = null;
  S.test = { secs: buildTest(), si: 0, qi: 0, phase: 'section', confirm: null, timer: null, endsAt: 0, startedAt: 0 };
  beginSection(0);
}
function beginSection(i) {
  const t = S.test; stopTimer();
  t.si = i; t.qi = 0; t.phase = 'section'; t.confirm = null;
  t.startedAt = Date.now(); t.endsAt = t.startedAt + t.secs[i].limit * 1000;
  t.timer = typeof setInterval === 'function' ? setInterval(tick, 1000) : null;
  renderTestQ(); window.scrollTo({ top: 0 });
  testSpeak();
}
function endSection(timedOut) {
  const t = S.test; if (!t || t.phase !== 'section') return;
  stopTimer(); stopSpeech();
  const sec = tsec();
  sec.used = Math.min(sec.limit, Math.round((Date.now() - t.startedAt) / 1000)); sec.timedOut = !!timedOut; sec.ended = true;
  t.confirm = null;
  if (t.si < t.secs.length - 1) { t.phase = 'break'; renderTestBreak(); }
  else { t.phase = 'done'; S.stats.played++; save(); renderTestResults(); }
  window.scrollTo({ top: 0 });
}
function renderTestSetup() {
  S.session = null; leaveTest();
  const p = testPlan();
  const seg = (act, cur, list) => list.map(([v, label]) => `<button class="seg ${cur === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${label}</button>`).join('');
  const lv = [1, 2, 3, 0].map(v => `<button class="seg ${S.settings.level === v ? 'on' : ''}" data-act="tlevel" data-v="${v}">${LV[v].icon} ${LV[v].name}</button>`).join('');
  $app().innerHTML = `
    <div class="topbar"><button class="btn ghost" data-act="home">← Home</button><span class="starpill">⭐ ${S.stats.stars}</span></div>
    <div class="introhero"><h1>⏱️ Practice Test</h1><p>A test-style session to practice sitting, thinking and finishing on time. It is practice only, not a real CogAT score.</p></div>
    <section class="isec setup">
      <h2>How it works</h2>
      <ul class="plain" style="font-size:17px;gap:6px">
        <li>• <b>3 sections:</b> Verbal, then Number, then Shapes. Each has 3 puzzle types.</li>
        <li>• <b>A timer</b> runs for each section. When time is up, the next section starts.</li>
        <li>• <b>No hints and no right or wrong feedback</b> until the very end.</li>
        <li>• You can <b>go back</b> and change an answer, or skip a hard one and return to it.</li>
        <li>• At the end you get a <b>report</b> and a review of every puzzle you missed, with the reasons.</li>
      </ul>
    </section>
    <section class="isec setup">
      <h2>Choose your test</h2>
      <div class="row"><label>Length</label><span class="segs">${seg('tsize', S.settings.testSize, [['short', 'Short · 18 puzzles'], ['full', 'Full · 36 puzzles']])}</span></div>
      <div class="row"><label>Pace</label><span class="segs">${seg('tpace', S.settings.testPace, [['relaxed', 'Relaxed'], ['standard', 'Standard'], ['quick', 'Quick']])}</span></div>
      <div class="row"><label>Level</label><span class="segs">${lv}</span></div>
      <div class="row"><button class="tog ${S.settings.speak ? 'on' : ''}" data-act="ttoggle" aria-pressed="${S.settings.speak}">🔊 Read the Verbal section aloud</button></div>
      <p class="caption" style="margin-top:12px;text-align:left">${p.total} puzzles in all: ${p.perSection} per section, about ${mins(p.secondsPerSection)} minutes per section (${PACE[S.settings.testPace]} seconds per puzzle). ${S.settings.level === 0 ? 'Ladder starts each puzzle type easy and gets harder.' : ''}</p>
    </section>
    <div class="introcta"><button class="btn primary big" style="--c:var(--nonv)" data-act="teststart">Start the test ➜</button></div>`;
  window.scrollTo({ top: 0 });
}
function renderTestQ() {
  const t = S.test, sec = tsec(), q = tq(), b = BAT[q.battery], cur = sec.answers[t.qi], n = sec.qs.length;
  const map = sec.qs.map((_, i) => `<button class="qm ${sec.answers[i] !== null ? 'done' : ''} ${i === t.qi ? 'now' : ''}" data-act="tgo" data-q="${i}" aria-label="Go to puzzle ${i + 1}">${i + 1}</button>`).join('');
  const opts = q.opts.map((o, i) => `<button class="opt ${cur === i ? 'sel' : ''}" data-act="tpick" data-i="${i}" aria-pressed="${cur === i}" aria-label="Choice ${'ABCD'[i]}"><span class="key">${'ABCD'[i]}</span>${o.html}</button>`).join('');
  const unans = sec.answers.filter(a => a === null).length;
  let conf = '';
  if (t.confirm === 'finish') conf = `<div class="confirm"><b>${unans ? `You have ${unans} puzzle${unans > 1 ? 's' : ''} without an answer.` : 'Every puzzle has an answer.'}</b> Finish this section now?<div class="actions"><button class="btn primary" style="--c:var(--good)" data-act="tfinishyes">Yes, finish</button><button class="btn" data-act="tfinishno">Keep working</button></div></div>`;
  else if (t.confirm === 'quit') conf = `<div class="confirm"><b>Quit the practice test?</b> Your answers so far will be lost.<div class="actions"><button class="btn primary" style="--c:var(--bad)" data-act="tquityes">Yes, quit</button><button class="btn" data-act="tquitno">Keep going</button></div></div>`;
  const last = t.qi === n - 1, r = remaining();
  $app().innerHTML = `
    <div class="topbar">
      <button class="btn ghost" data-act="tquit">✕ Quit</button>
      <div class="caption" style="flex:1;font-weight:700">Section ${t.si + 1} of ${t.secs.length}: ${sec.name}</div>
      <span class="starpill clock${r <= 60 ? ' low' : ''}" id="clock" aria-live="off">⏱️ ${fmt(r)}</span>
    </div>
    <div class="qmap" aria-label="Puzzle map">${map}</div>
    <div class="qcard" style="--c:var(${b.color})">
      <span class="tag">${b.emoji} ${q.sub}</span><span class="caption" style="margin-left:10px">Puzzle ${t.qi + 1} of ${n}</span>
      <div class="prompt"><button class="speak" data-act="tspeak" aria-label="Read the puzzle aloud">🔊</button><span>${q.prompt}</span></div>
      <div class="visual">${q.visual}</div>
      <div class="options">${opts}</div>
      <div class="navrow">
        <button class="btn" data-act="tprev" ${t.qi === 0 ? 'disabled style="opacity:.4;cursor:default"' : ''}>← Back</button>
        ${last ? `<button class="btn primary" style="--c:var(${b.color})" data-act="tfinish">Finish section ✔</button>` : `<button class="btn primary" style="--c:var(${b.color})" data-act="tnext">Next →</button>`}
      </div>
      ${conf}
    </div>`;
}
function renderTestBreak() {
  const t = S.test, done = tsec(), nxt = t.secs[t.si + 1], answered = done.answers.filter(a => a !== null).length;
  $app().innerHTML = `
    <div class="results">
      <h2>✅ Section ${t.si + 1} done: ${done.name}</h2>
      <p style="margin-top:8px">You answered ${answered} of ${done.qs.length} puzzles${done.timedOut ? ' before time ran out' : ''}.</p>
      <p class="caption" style="margin-top:10px">Take a breath. Stretch. Have a sip of water.</p>
      <div class="rbtns"><button class="btn primary big" style="--c:var(${BAT[nxt.bat].color})" data-act="tcontinue">Start Section ${t.si + 2}: ${nxt.name} ➜</button></div>
      <p class="caption" style="margin-top:10px">Next: ${nxt.qs.length} puzzles, ${mins(nxt.limit)} minutes.</p>
    </div>`;
}
function renderTestResults() {
  const t = S.test, byType = {}, byLvl = {}, tot = { c: 0, n: 0, u: 0 }, miss = [];
  const secRows = t.secs.map(sec => {
    let c = 0, u = 0;
    sec.qs.forEach((q, i) => {
      const a = sec.answers[i], ok = a === q.ans;
      if (a === null) u++;
      if (ok) c++; else miss.push({ sec, q, a, i });
      const bt = byType[q.sub] = byType[q.sub] || { c: 0, n: 0, bat: q.battery, sub: Object.keys(BAT[q.battery].subs).find(k => BAT[q.battery].subs[k].name === q.sub) };
      bt.n++; if (ok) bt.c++;
      const bl = byLvl[q.level] = byLvl[q.level] || { c: 0, n: 0 };
      bl.n++; if (ok) bl.c++;
    });
    tot.c += c; tot.n += sec.qs.length; tot.u += u;
    return `<div class="brow"><span class="lbl">${BAT[sec.bat].emoji} ${sec.name}${sec.timedOut ? ' ⏰' : ''}</span><span class="bar"><i style="width:${Math.round(100 * c / sec.qs.length)}%"></i></span><span class="n">${c}/${sec.qs.length}</span></div><div class="caption" style="text-align:left;margin:-4px 0 4px 0">Time used: ${fmt(sec.used)} of ${fmt(sec.limit)}${u ? ` · ${u} unanswered` : ''}</div>`;
  }).join('');
  const rowsOf = (obj, label) => Object.entries(obj).map(([k, v]) => `<div class="brow"><span class="lbl">${label(k)}</span><span class="bar"><i style="width:${Math.round(100 * v.c / v.n)}%"></i></span><span class="n">${v.c}/${v.n}</span></div>`).join('');
  const pct = tot.n ? tot.c / tot.n : 0;
  const msg = pct >= 0.85 ? 'Fantastic work! 🌟' : pct >= 0.65 ? 'Great job! 🎉' : pct >= 0.4 ? 'Nice effort. Keep practicing! 💪' : 'Good start! Every practice makes it easier. 🌱';
  const weak = Object.values(byType).filter(v => v.n >= 2 && v.c / v.n < 1).sort((a, b) => a.c / a.n - b.c / b.n)[0];
  const review = miss.map(({ sec, q, a, i }) => {
    const b = BAT[q.battery];
    const optsR = q.opts.map((o, k) => {
      const cls = k === q.ans ? 'right' : k === a ? 'wrong' : 'dim';
      const badge = k === q.ans ? '<span class="badge" style="color:var(--good)">✔ right answer</span>' : k === a ? '<span class="badge" style="color:var(--bad)">✖ your answer</span>' : '';
      return `<div class="opt static ${cls}"><span class="key">${'ABCD'[k]}</span>${badge}${o.html}</div>`;
    }).join('');
    return `<details class="rev"><summary>${b.emoji} ${sec.name} · ${q.sub} · puzzle ${i + 1} ${a === null ? '(no answer)' : '(missed)'}</summary><div class="visual">${q.visual}</div><div class="options">${optsR}</div><div class="why"><b>Why:</b> ${q.why}</div></details>`;
  }).join('');
  $app().innerHTML = `
    <div class="results">
      <h2>${msg}</h2>
      <div class="bigscore">${tot.c} / ${tot.n}</div>
      <p class="caption">${tot.u ? `${tot.u} puzzle${tot.u > 1 ? 's' : ''} left unanswered. ` : ''}This is practice, not a CogAT score.</p>
      <div class="break">
        <h3>By section</h3>${secRows}
        <h3>By puzzle type</h3>${rowsOf(byType, k => k)}
        <h3>By level</h3>${Object.keys(byLvl).sort().map(k => `<div class="brow"><span class="lbl">${LV[k].icon} ${LV[k].name}</span><span class="bar"><i style="width:${Math.round(100 * byLvl[k].c / byLvl[k].n)}%"></i></span><span class="n">${byLvl[k].c}/${byLvl[k].n}</span></div>`).join('')}
      </div>
      ${weak ? `<p style="margin-top:14px;font-weight:700">Most to practice: ${weak.sub}</p>` : '<p style="margin-top:14px;font-weight:700">No weak spots this time. Great!</p>'}
      <div class="rbtns">
        ${weak ? `<button class="btn primary big" style="--c:var(--good)" data-act="start" data-bat="${weak.bat}" data-sub="${weak.sub}">Practice ${BAT[weak.bat].subs[weak.sub].name}</button>` : ''}
        <button class="btn big" data-act="testhome">Take another test</button>
        <button class="btn big" data-act="home">Home</button>
      </div>
      ${miss.length ? `<div class="break" style="max-width:640px"><h3>Review the ${miss.length} I missed</h3>${review}</div>` : ''}
    </div>`;
}
const TEST_ACTS = new Set(['testhome', 'tsize', 'tpace', 'tlevel', 'ttoggle', 'teststart', 'tpick', 'tgo', 'tprev', 'tnext', 'tspeak', 'tfinish', 'tfinishyes', 'tfinishno', 'tquit', 'tquityes', 'tquitno', 'tcontinue']);
function testAction(a, el) {
  const t = S.test;
  if (a === 'testhome') renderTestSetup();
  else if (a === 'tsize') { S.settings.testSize = el.dataset.v; save(); renderTestSetup(); }
  else if (a === 'tpace') { S.settings.testPace = el.dataset.v; save(); renderTestSetup(); }
  else if (a === 'tlevel') { S.settings.level = +el.dataset.v; save(); renderTestSetup(); }
  else if (a === 'ttoggle') { S.settings.speak = !S.settings.speak; save(); renderTestSetup(); }
  else if (a === 'teststart') startTest();
  else if (!t || t.phase === 'done') return;
  else if (a === 'tcontinue') { if (t.phase === 'break') beginSection(t.si + 1); }
  else if (t.phase !== 'section') return;
  else if (a === 'tpick') { tsec().answers[t.qi] = +el.dataset.i; renderTestQ(); }
  else if (a === 'tgo') { t.qi = +el.dataset.q; t.confirm = null; renderTestQ(); testSpeak(); }
  else if (a === 'tprev') { if (t.qi > 0) { t.qi--; t.confirm = null; renderTestQ(); testSpeak(); } }
  else if (a === 'tnext') { if (t.qi < tsec().qs.length - 1) { t.qi++; t.confirm = null; renderTestQ(); testSpeak(); } }
  else if (a === 'tspeak') speak(tq().say);
  else if (a === 'tfinish') { t.confirm = 'finish'; renderTestQ(); }
  else if (a === 'tfinishno' || a === 'tquitno') { t.confirm = null; renderTestQ(); }
  else if (a === 'tfinishyes') endSection(false);
  else if (a === 'tquit') { t.confirm = 'quit'; renderTestQ(); }
  else if (a === 'tquityes') { stopSpeech(); leaveTest(); renderHome(); window.scrollTo({ top: 0 }); }
}

/* ============ game flow ============ */
function startSession(spec, queue, opts) {
  stopSpeech();
  S.session = { spec, opts: opts || null, queue: queue || buildQueue(spec, opts), i: 0, res: [], picked: null, hint: false, streak: 0, best: 0, stars: 0 };
  renderQ();
  window.scrollTo({ top: 0 });
  if (S.settings.speak) speak(curQ().say);
}
function choose(i) {
  const s = S.session, q = curQ();
  if (s.picked !== null) return;
  s.picked = i;
  const ok = i === q.ans;
  s.res.push({ q, ok });
  if (ok) { s.stars++; s.streak++; s.best = Math.max(s.best, s.streak); S.stats.stars++; } else s.streak = 0;
  save(); renderQ(); stopSpeech();
}
function next() {
  const s = S.session; s.i++;
  if (s.i >= s.queue.length) { S.stats.played++; save(); stopSpeech(); renderResults(); window.scrollTo({ top: 0 }); return; }
  s.picked = null; s.hint = false; renderQ();
  if (S.settings.speak) speak(curQ().say);
  window.scrollTo({ top: 0 });
}
function onClick(e) {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (TEST_ACTS.has(a)) { testAction(a, t); return; }
  if (a === 'start') { leaveTest(); startSession({ bat: t.dataset.bat, sub: t.dataset.sub }); }
  else if (a === 'try') startSession({ bat: t.dataset.bat, sub: t.dataset.sub }, null, { len: 3, level: 1 });
  else if (a === 'guide') renderGuide();
  else if (a === 'intro') renderIntro();
  else if (a === 'begin') { S.settings.seenIntro = true; save(); renderHome(); window.scrollTo({ top: 0 }); }
  else if (a === 'home') { stopSpeech(); leaveTest(); renderHome(); window.scrollTo({ top: 0 }); }
  else if (a === 'level') { S.settings.level = +t.dataset.v; save(); renderHome(); }
  else if (a === 'len') { S.settings.len = +t.dataset.v; save(); renderHome(); }
  else if (a === 'toggle') { const k = t.dataset.k; S.settings[k] = !S.settings[k]; save(); renderHome(); }
  else if (a === 'pick') choose(+t.dataset.i);
  else if (a === 'next') next();
  else if (a === 'hint') { S.session.hint = !S.session.hint; renderQ(); }
  else if (a === 'speak') speak(curQ().say);
  else if (a === 'again') startSession(S.session.spec, null, S.session.opts);
  else if (a === 'missed') startSession(S.session.spec, S.session.res.filter(r => !r.ok).map(r => r.q), S.session.opts);
}
function onKey(e) {
  if (S.test && S.test.phase === 'section') {
    const t = S.test, sec = tsec(), k = e.key.toLowerCase();
    const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (k.length === 1 && i >= 0 && i < tq().opts.length) { sec.answers[t.qi] = i; renderTestQ(); }
    else if (e.key === 'ArrowRight' && t.qi < sec.qs.length - 1) { t.qi++; t.confirm = null; renderTestQ(); testSpeak(); }
    else if (e.key === 'ArrowLeft' && t.qi > 0) { t.qi--; t.confirm = null; renderTestQ(); testSpeak(); }
    return;
  }
  const s = S.session; if (!s || !s.queue[s.i] || s.i >= s.queue.length) return;
  if (document.querySelector('.results')) return;
  const k = e.key.toLowerCase(), i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (s.picked === null && i >= 0 && i < curQ().opts.length && k.length === 1) choose(i);
  else if (s.picked !== null && e.key === 'Enter') next();
}
function init() { load(); if (S.settings.seenIntro) renderHome(); else renderIntro(); $app().addEventListener('click', onClick); document.addEventListener('keydown', onKey); }
if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) init();
</script>
