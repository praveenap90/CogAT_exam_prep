  var L3=[cubeLayer(3,0,'Top layer'),cubeLayer(3,1,'Middle layer'),cubeLayer(3,2,'Bottom layer')];
  var names4=['Top layer','Second layer','Third layer','Bottom layer'];
  var L4=[0,1,2,3].map(function(l){return cubeLayer(4,l,names4[l])});
  var legend='<div class="lgrow">'+[[3,'3 painted faces: a corner'],[2,'2 painted faces: an edge'],[1,'1 painted face: the middle of a face'],[0,'0 painted faces: inside, hidden']].map(function(x){return '<span class="lg"><i class="pc p'+x[0]+'">'+x[0]+'</i>'+x[1]+'</span>'}).join('')+'</div>';
  return '<div class="explain">'+
   '<p>Take a big cube and paint all 6 of its outside faces. Then cut it into small, equal cubes. The question asks how many small cubes have 3 painted faces, how many have 2, how many have 1, and how many have none.</p>'+
   '<h4>The idea: where a small cube sat decides its paint</h4>'+
   '<p>A small cube is painted on every side that was on the outside of the big cube. So count how many outside faces each small cube touched. There are only four kinds of spot.</p>'+legend+
   '<h4>Warm-up: a cube cut into 27 pieces (3 × 3 × 3)</h4>'+
   '<ol class="steps">'+
    '<li><strong>Look at each layer.</strong> The big cube has 3 layers, stacked like floors of a building. The number in each box is how many painted faces that small cube has.'+row(L3)+'</li>'+
    '<li><strong>Count the 3s.</strong> They are the corners of the top and bottom layers: 4 + 4 = <b>8</b>.</li>'+
    '<li><strong>Count the 2s.</strong> The top layer has 4, the bottom layer has 4, and the middle layer has 4 (its corners sit on the vertical edges of the big cube). 4 + 4 + 4 = <b>12</b>.</li>'+
    '<li><strong>Count the 1s.</strong> The top has 1, the bottom has 1, and the middle layer has 4. 1 + 1 + 4 = <b>6</b>.</li>'+
    '<li><strong>Count the 0s.</strong> Only the centre box of the middle layer: <b>1</b>.</li>'+
    '<li><strong>Check.</strong> 8 + 12 + 6 + 1 = <b>27</b>, the total number of small cubes.</li>'+
   '</ol>'+
   '<h4>Counting without drawing every layer</h4>'+
   '<p>Drawing layers is fine for small cubes. For bigger ones, count each kind of spot with a formula. Let <strong>n</strong> be the number of small cubes along one edge of the big cube. For 27 pieces n = 3, and for 64 pieces n = 4.</p>'+
   table(['Kind of spot','How many','Why'],[
     ['Corners (3 painted)','8','Every cube has 8 corners, whatever its size.'],
     ['Edges (2 painted)','12 × (n − 2)','A cube has 12 edges. On each edge, remove the 2 corner cubes at its ends. n − 2 are left.'],
     ['Middle of a face (1 painted)','6 × (n − 2) × (n − 2)','A cube has 6 faces. On each face, remove the outer ring of boxes. An (n − 2) by (n − 2) block is left in the middle.'],
     ['Inside (0 painted)','(n − 2) × (n − 2) × (n − 2)','Peel one layer off every side. The cube left in the middle is never painted.']
   ],false)+
   '<h4>Example: a cube cut into 64 pieces (4 × 4 × 4)</h4>'+
   '<p>Here n = 4, so n − 2 = 2. These are the four layers.</p>'+row(L4)+
   table(['Painted faces','Working','Count'],[['3','8','8'],['2','12 × 2','24'],['1','6 × 2 × 2','24'],['0','2 × 2 × 2','8'],['Total','8 + 24 + 24 + 8','64']],false,true)+
   '<h4>Tips for the test</h4>'+
   '<ul class="steps">'+
    '<li><strong>Find n from the total.</strong> 8 pieces means n = 2, 27 means 3, 64 means 4, 125 means 5, 216 means 6.</li>'+
    '<li><strong>The 8 corners never change.</strong> Only the edge, face and inside counts depend on n.</li>'+
    '<li><strong>Always check.</strong> Add your four answers. They must equal the total number of small cubes.</li>'+
    '<li><strong>At least one painted face</strong> is the total minus the unpainted ones. For 27 pieces: 27 − 1 = 26.</li>'+
    '<li><strong>Read which faces are painted.</strong> These rules assume all 6 faces are painted. If only some faces are, count from a picture instead.</li>'+
   '</ul>'+
   '<details><summary>Try it: a cube is cut into 64 pieces. How many have exactly one painted face?</summary><p>6 faces × (2 × 2) = <b>24</b>.</p></details>'+
  '</div>';
}
function miniGrid(n,r,c,k,cap){
  var cells='';
  for(var i=0;i<n;i++)for(var j=0;j<n;j++){
    cells+='<i'+((i>=r&&i<r+k&&j>=c&&j<c+k)?' class="on"':'')+'></i>';
  }
  return '<figure class="mg"><div class="mgrid" style="grid-template-columns:repeat('+n+',auto)" role="img" aria-label="A '+k+' by '+k+' square starting at row '+(r+1)+', column '+(c+1)+' of a '+n+' by '+n+' grid">'+cells+'</div><figcaption>'+cap+'</figcaption></figure>';
}
function squaresExplainer(){
  var row=function(a){return '<div class="mgrow">'+a.join('')+'</div>'};
  var s3=[miniGrid(3,0,0,2,'top left'),miniGrid(3,0,1,2,'top right'),miniGrid(3,1,0,2,'bottom left'),miniGrid(3,1,1,2,'bottom right')];
  var s5=[0,1,2,3].map(function(c){return miniGrid(5,0,c,2,'starts in column '+(c+1))});
  return '<div class="explain">'+
   '<p>A <strong>5 × 5 grid</strong> has 5 small boxes across and 5 down. The question asks you to count <strong>every square</strong> you can find, big and small. Count them one size at a time, then add the counts together.</p>'+
   '<h4>Warm-up: a 3 × 3 grid</h4>'+
   '<ol class="steps">'+
    '<li><strong>Size 1.</strong> These are the small boxes. 3 across × 3 down = <b>9</b>.</li>'+
    '<li><strong>Size 2.</strong> A square made of 4 small boxes fits in only 4 places. The coloured boxes show each one.'+row(s3)+'<p>That gives <b>4</b>.</p></li>'+
    '<li><strong>Size 3.</strong> This is the whole grid. That is <b>1</b>.</li>'+
    '<li><strong>Total.</strong> 9 + 4 + 1 = <b>14</b>.</li>'+
   '</ol>'+
   '<h4>Now the 5 × 5 grid</h4>'+
   '<ol class="steps">'+
    '<li><strong>Size 1.</strong> 5 across × 5 down = <b>25</b>.</li>'+
    '<li><strong>Size 2.</strong> A square 2 boxes wide can start in column 1, 2, 3 or 4. It cannot start in column 5, because it would stick out of the grid. The same is true going down: it can start in row 1, 2, 3 or 4. So 4 across × 4 down = <b>16</b>.'+row(s5)+'<p class="note">These are the 4 places in the top row. The same 4 places repeat in each of the other 3 rows.</p></li>'+
    '<li><strong>Size 3.</strong> It can start in columns 1, 2 or 3, and in rows 1, 2 or 3. 3 × 3 = <b>9</b>.</li>'+
    '<li><strong>Size 4.</strong> It can start in columns 1 or 2, and in rows 1 or 2. 2 × 2 = <b>4</b>.</li>'+
    '<li><strong>Size 5.</strong> This is the whole grid. That is <b>1</b>.</li>'+
    '<li><strong>Add them up.</strong> 25 + 16 + 9 + 4 + 1 = <b>55</b>.</li>'+
   '</ol>'+
   table(['Square size','Places across × places down','How many'],[['1 × 1','5 × 5','25'],['2 × 2','4 × 4','16'],['3 × 3','3 × 3','9'],['4 × 4','2 × 2','4'],['5 × 5','1 × 1','1'],['Total','','55']],true)+
   '<p class="note">Pattern: the bigger the square, the fewer places it fits. For any n × n grid, square each number from n down to 1 and add. For 5 × 5 that is 5² + 4² + 3² + 2² + 1² = 55.</p>'+
  '</div>';
}

/* ---------- spatial tips ---------- */
function spFig(cells,B,cs,label){
  cs=cs||14; var w=B*cs, out='<svg class="sp" xmlns="http://www.w3.org/2000/svg" width="'+(w+2)+'" height="'+(w+2)+'" viewBox="-1 -1 '+(w+2)+' '+(w+2)+'" role="img" aria-label="'+esc(label||'shape')+'">';
  out+='<rect x="0" y="0" width="'+w+'" height="'+w+'" fill="none" stroke="currentColor" stroke-opacity=".35"/>';
  for(var i=1;i<B;i++){out+='<path d="M'+(i*cs)+' 0V'+w+' M0 '+(i*cs)+'H'+w+'" stroke="currentColor" stroke-opacity=".15"/>'}
  cells.forEach(function(c){out+='<rect x="'+(c[0]*cs+1)+'" y="'+(c[1]*cs+1)+'" width="'+(cs-2)+'" height="'+(cs-2)+'" fill="currentColor"/>'});
  return out+'</svg>';
}
function spNorm(c){var mx=Math.min.apply(null,c.map(function(p){return p[0]})),my=Math.min.apply(null,c.map(function(p){return p[1]}));return c.map(function(p){return [p[0]-mx,p[1]-my]})}
function spRot(c){return spNorm(c.map(function(p){return [-p[1],p[0]]}))}
function spFlip(c){return spNorm(c.map(function(p){return [-p[0],p[1]]}))}
function spCap(svg,cap){return '<figure>'+svg+'<figcaption>'+cap+'</figcaption></figure>'}
function spatialExplainer(){
  var F0=[[1,0],[2,0],[0,1],[1,1],[1,2]], B=3;
  var r1=spRot(F0), r2=spRot(r1), fl=spFlip(F0);
  return '<div class="explain">'+
   '<p>Most shape questions ask one thing: <strong>is this the same shape turned, or is it flipped?</strong> A turned shape is the same shape. A flipped shape is its mirror image, and it is a different shape for these questions.</p>'+
   '<div class="tipfig">'+spCap(spFig(F0,B,16,'original shape'),'Original')+spCap(spFig(r1,B,16,'original turned 90 degrees clockwise'),'Turned 90° clockwise: same shape')+spCap(spFig(r2,B,16,'original turned 180 degrees'),'Turned 180°: same shape')+spCap(spFig(fl,B,16,'original flipped left to right'),'Flipped left to right: different shape')+'</div>'+
   '<h4>How to tell a turn from a flip, step by step</h4>'+
   '<ol class="steps">'+
    '<li><strong>Find a landmark.</strong> Pick the one square that sticks out the most. In the shape above it is the square at the top right.</li>'+
    '<li><strong>Find its neighbour.</strong> Note which square it touches and in which direction. Here the landmark sits to the right of the top-middle square.</li>'+
    '<li><strong>Turn the page in your head.</strong> Turn by a quarter turn, or a half turn, until the landmark lands where the option shows it.</li>'+
    '<li><strong>Check the rest.</strong> If the landmark fits but the other squares sit on the wrong side of it, the option is a flip. Turning can never fix that.</li>'+
   '</ol>'+
   '<p class="note">Your hands are the best example: a left glove and a right glove have the same shape, but you can never turn one into the other. That is a flip.</p>'+
  '</div>';
}
function spatialChecklist(){
  var F0=[[1,0],[2,0],[0,1],[1,1],[1,2]], B=3;
  var r1=spRot(F0), r2=spRot(r1), r3=spRot(r2), fl=spFlip(F0);
  var cap=function(n,t){return spCap(spFig(t,B,16,'figure '+n),n)};
  return '<div class="explain">'+
   '<h4>The 3-check routine (about 10 seconds)</h4>'+
   '<ol class="steps">'+
    '<li><strong>Count the squares.</strong> An option with a different number of squares is out.</li>'+
    '<li><strong>Compare the outline.</strong> A different overall shape, such as long and thin against square, is out. This removes the options with one square moved.</li>'+
    '<li><strong>Check for a flip.</strong> Pick a landmark square and note which side of it the neighbouring squares sit on. If the sides swapped, the option is a mirror image and is out.</li>'+
   '</ol>'+
   '<p>Whatever is left is the answer. You never need the turn angle.</p>'+
   '<h4>Worked example: odd one out</h4>'+
   '<p>Four of these figures are the same shape turned. Which one is different?</p>'+
   '<div class="tipfig">'+cap('A',F0)+cap('B',r1)+cap('C',r2)+cap('D',r3)+cap('E',fl)+'</div>'+
   '<ol class="steps">'+
    '<li><strong>Count.</strong> Every figure has 5 squares, so counting does not help here.</li>'+
    '<li><strong>Outline.</strong> Every figure fits a 3 × 3 box, so the outline does not help either. That means the odd one is probably a mirror image.</li>'+
    '<li><strong>Landmark.</strong> Find the column of three squares and the two squares that stick out from it. In A they are a square at the top right and a square to the left of the middle. Turn A until its column lines up with the one in B, C or D. The two squares that stick out land in the right places each time.</li>'+
    '<li><strong>Test E.</strong> In E the two squares that stick out are on the opposite sides. The top one is on the left and the middle one is on the right. No turn gives that, so <b>E is the odd one out</b>.</li>'+
   '</ol>'+
   '<h4>How to tell a quarter turn from a half turn</h4>'+
   '<ol class="steps">'+
    '<li><strong>Look at the longest bar.</strong> If it went from vertical to horizontal, or the other way, it is a <b>quarter turn</b>.</li>'+
    '<li><strong>Bar in the same direction?</strong> Then it is either no turn or a <b>half turn</b>. Look at which end the tail is on. If the tail moved to the opposite end, it is a half turn.</li>'+
   '</ol>'+
   '<h4>Sequences: ask what changes</h4>'+
   table(['What to check','How','Example'],[['Position','Count how many places the shaded square moves from figure 1 to 2, and note the direction','Moves 2 places clockwise each step'],['Angle','Find the turn between figures 1 and 2, then test it on figures 2 and 3','Quarter turn clockwise each step'],['Count','Count the shaded squares in each figure','1, 2, 3, then 4']],false)+
   '<p class="note">Time rule: if the checks do not settle it in about 10 seconds, guess and move on. Criteria says wrong answers are not penalized. Cutting out a paper F-shape and turning and flipping it for two minutes makes the idea stick.</p>'+
  '</div>';
}

    if(f!=='all'&&t.k!==f)return '';
    return '<section class="card tipsec"><h2>'+t.title+'</h2><div class="tipgrid">'+
      t.groups.map(function(g){return '<div><h3>'+g.h+'</h3><ul>'+g.items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>'}).join('')+
      '</div><div>'+t.tables()+'</div></section>';
  }).join('');
  return '<div class="page-head"><span class="eyebrow">Tips to remember</span><h1>Math, logic, verbal and spatial</h1>'+
    '<p class="lede">Short rules and reference tables to learn before the test. Skim the section where you lost the most points in your last practice run.</p></div>'+
    '<div class="seg" style="margin-bottom:18px">'+seg+'</div>'+secs;
}
function renderTabs(){
  return '<nav class="tabs" aria-label="Sections">'+[['practice','Practice test'],['key','Answer key'],['tips','Tips']].map(function(t){
    return '<button data-a="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>';
  }).join('')+'</nav>';
}

function render(){
  var app=$('#app');
  if(ui.view==='test'){app.innerHTML=renderTest();return}
  var body = ui.tab==='key' ? renderKey() : ui.tab==='tips' ? renderTips() : (ui.view==='results' ? renderResults() : renderStart());
  app.innerHTML = renderTabs()+body;
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b)return;
  var a=b.dataset.a, i=+b.dataset.i;
  if(a==='mode'){newAttempt(b.dataset.m)}
  else if(a==='tab'){ui.tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(a==='kfilter'){ui.kf=b.dataset.f;render()}
  else if(a==='tfilter'){ui.tf=b.dataset.f;render()}
  else if(a==='home'){ui.view='start';ui.tab='practice';render();window.scrollTo(0,0)}
  else if(a==='retry'){newAttempt(S.mode)}
  else if(a==='filter'){ui.filter=b.dataset.f;render()}
  else if(!S||S.done){return}
  else if(a==='pick'){choose(i)}
  else if(a==='next'){go(S.cur+1)}
  else if(a==='prev'){go(S.cur-1)}
  else if(a==='go'){go(i)}
  else if(a==='flag'){S.items[S.cur].flag=!S.items[S.cur].flag;render()}
  else if(a==='ask'){ui.confirm=true;render()}
  else if(a==='cancel'){ui.confirm=false;render()}
  else if(a==='submit'){finish(false)}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='auto'){ui.auto=e.target.checked}
});
document.addEventListener('keydown',function(e){
  if(ui.view!=='test'||!S||S.done||ui.confirm||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase();
  if(k.length===1 && '12345'.indexOf(k)>-1){choose(+k-1);return}
  if(k.length===1 && 'abcde'.indexOf(k)>-1){choose('abcde'.indexOf(k));return}
  if(k==='n'||k==='arrowright'){go(S.cur+1)}
  else if(k==='p'||k==='arrowleft'){go(S.cur-1)}
  else if(k==='f'){S.items[S.cur].flag=!S.items[S.cur].flag;render()}
});

render();
})();
</script>

</body>
</html>
