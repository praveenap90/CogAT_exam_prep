<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0}</style>
</head>
<body>
<title>CCAT Practice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: exam-booklet single column; sticky timer bar, question card with a numbered navigator beside it on wide screens. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151B26; --muted:#566074; --line:#D8DEE8;
  --accent:#2347D9; --accent-ink:#FFFFFF; --accent-soft:#E3E9FD;
  --warn:#B4540A; --warn-soft:#FDEBD8; --ok:#157A3C; --ok-soft:#DDF3E4; --bad:#B42318; --bad-soft:#FCE4E1;
  --font-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E121A; --surface:#161C27; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3342;
    --accent:#8AA5FF; --accent-ink:#0E121A; --accent-soft:#1E2A52;
    --warn:#F0A04B; --warn-soft:#3A2810; --ok:#4ADE80; --ok-soft:#10301D; --bad:#F87171; --bad-soft:#3B1717;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161C27; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3342;
  --accent:#8AA5FF; --accent-ink:#0E121A; --accent-soft:#1E2A52;
  --warn:#F0A04B; --warn-soft:#3A2810; --ok:#4ADE80; --ok-soft:#10301D; --bad:#F87171; --bad-soft:#3B1717;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:68rem;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 .75rem/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* start */
.hero{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05;font-weight:700}
.lede{max-width:62ch;color:var(--muted);font-size:1.05rem}
.grp{font-size:1.05rem;margin:22px 0 10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:14px;margin-bottom:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode .big{font:500 2rem/1 var(--font-mono);font-variant-numeric:tabular-nums}
.mode .name{font-weight:600}
.mode .sub{color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.9rem;max-width:70ch}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:20px;margin-top:36px}
.tips .card h2{font-size:1.25rem;margin-bottom:12px}
.tips ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:10px}
.tips li{padding-left:2px}
.tips li strong{font-weight:600}
.hist{margin-top:28px}
.hist h2{font-size:1.05rem;margin-bottom:8px}
.hist table{border-collapse:collapse;width:100%;max-width:30rem;font-size:.92rem}
.hist td,.hist th{padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--line);font-weight:400}
.hist th{color:var(--muted);font:500 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}

/* test */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar-in{max-width:68rem;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.qcount{white-space:nowrap}
.prog{flex:1;min-width:7rem;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.clock{display:flex;align-items:baseline;gap:8px;padding:4px 10px;border-radius:8px}
.clock .lbl{font:500 .7rem/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clock #clock{font-size:1.5rem;font-weight:500;line-height:1.2}
.clock.low{background:var(--warn-soft);color:var(--warn)}
.clock.low .lbl{color:var(--warn)}
.test-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media (min-width:860px){.test-grid{grid-template-columns:minmax(0,1fr) 19rem}.side{position:sticky;top:5rem}}
.qcard{padding:24px}
.qmeta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{font:500 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.chip.flag{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:clamp(1.25rem,3.2vw,1.6rem);line-height:1.3;font-weight:600;margin-bottom:20px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:3.25rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:none;width:2rem;height:2rem;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:6px;font:500 .9rem/1 var(--font-mono);color:var(--muted)}
.opt .otext{min-width:0;overflow-wrap:anywhere}
.sp{display:block;flex:none;color:var(--ink);max-width:100%}
.stemfig{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.rv .stemfig{margin:10px 0}
.tipfig{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.tipfig figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tipfig figcaption{font-size:.78rem;color:var(--muted);text-align:center;max-width:9rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.qnav .grow{flex:1}
.keys{margin-top:14px;color:var(--muted);font-size:.82rem}
.btn{padding:.65rem 1.1rem;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.wide{width:100%}
.btn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.side h2{font-size:1rem;margin-bottom:4px}
.side .tally{color:var(--muted);font-size:.88rem;margin-bottom:12px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.4rem,1fr));gap:6px;margin-bottom:14px}
.dot{height:2.4rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:500 .82rem/1 var(--font-mono);color:var(--muted);cursor:pointer;padding:0}
.dot.ans{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot.fl{border-bottom:4px solid var(--warn)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-bottom:16px}
.legend span::before{content:"";display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .l-ans::before{background:var(--accent-soft);border-color:transparent}
.legend .l-fl::before{border-bottom:4px solid var(--warn)}
.auto{display:flex;gap:8px;align-items:center;font-size:.88rem;margin-bottom:14px}
.auto input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.confirm{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px}
.confirm p{margin-bottom:10px;font-weight:500}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* results */
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500;margin-bottom:16px}
.res-top{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-block:18px 24px}
@media (min-width:760px){.res-top{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:40px}}
.score{display:flex;align-items:baseline;gap:10px}
.score .num{font:700 clamp(4rem,14vw,6.5rem)/1 var(--font-display);font-variant-numeric:tabular-nums}
.score .of{font:500 1.5rem/1 var(--font-mono);color:var(--muted)}
.pct{color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:0}
.stat{padding:8px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0;padding-left:0}
.stat dt{font:500 .7rem/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat dd{margin:0;font:500 1.5rem/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.secs{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.srow{display:grid;grid-template-columns:7rem minmax(0,1fr) 5.5rem 5rem;gap:12px;align-items:center}
.srow .nm{font-weight:600}
.srow .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.srow .track i{display:block;height:100%;background:var(--accent)}
.srow .sc,.srow .tm{font-size:.9rem;text-align:right}
.srow .tm{color:var(--muted)}
@media (max-width:520px){.srow{grid-template-columns:5.5rem minmax(0,1fr) 4rem}.srow .tm{display:none}}
.coach{margin-top:16px;color:var(--muted);max-width:70ch}
.coach strong{color:var(--ink)}
.rv-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:32px 0 14px}
.rv-head h2{font-size:1.4rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:.4rem .8rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:.88rem;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.rv-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.st{font:500 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.blank{background:var(--line);color:var(--muted)}
.rv .qn{color:var(--muted);font-size:.85rem}
.rv .t{margin-left:auto;color:var(--muted);font-size:.85rem}
.rv .q{font-weight:600;overflow-wrap:anywhere}
.ro{display:flex;flex-direction:column;gap:6px}
.ro div{display:flex;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:.95rem}
.ro .mk{flex:none;width:1.4rem;font-family:var(--font-mono);color:var(--muted)}
.ro .ok{background:var(--ok-soft);border-color:transparent}
.ro .ok .mk{color:var(--ok)}
.ro .bad{background:var(--bad-soft);border-color:transparent}
.ro .bad .mk{color:var(--bad)}
.ro .tag{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.exp{color:var(--muted);font-size:.93rem;border-top:1px solid var(--line);padding-top:10px}
.exp b{color:var(--ink);font-weight:600}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.foot{margin-top:36px;color:var(--muted);font-size:.85rem;max-width:70ch}
/* tabs, answer key, tips */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
.tabs button{padding:.7rem 1rem;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.page-head{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.page-head h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;font-weight:700}
.qk{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:6px 12px;margin:0 0 8px;padding:0;list-style:none}
.qk li{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;font-size:.92rem}
.qk b{font:500 .8rem/1 var(--font-mono);color:var(--muted);min-width:1.4rem}
.qk span{overflow-wrap:anywhere}
.tipsec{display:flex;flex-direction:column;gap:20px;margin-bottom:20px}
.tipsec h2{font-size:1.5rem}
.tipsec h3{font-size:1.02rem;margin-bottom:8px}
.tipsec ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:7px}
.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:22px}
.refwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ref{border-collapse:collapse;width:100%;font-size:.92rem}
.ref th,.ref td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.ref tr:last-child td{border-bottom:0}
.ref th{font:500 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.ref td:first-child{font-weight:600;min-width:7.5rem}
.ref td.m{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.explain{display:flex;flex-direction:column;gap:14px}
.explain h4{font:700 1.05rem/1.3 var(--font-display);margin:10px 0 0}
.steps{margin:0;padding-left:1.5rem;display:flex;flex-direction:column;gap:14px}
.steps li{padding-left:4px}
.steps li p{margin:8px 0 0}
.mgrow{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}
.mg{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.mg figcaption{font-size:.78rem;color:var(--muted);text-align:center}
.mgrid{display:grid;gap:2px;padding:4px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
.mgrid i{display:block;width:1.15rem;height:1.15rem;border:1px solid var(--line);border-radius:2px}
.mgrid i.on{background:var(--accent);border-color:var(--accent)}
.cgrid{display:grid;gap:3px;padding:5px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
.pc{display:grid;place-items:center;width:1.75rem;height:1.75rem;border:1px solid var(--line);border-radius:4px;font:600 .85rem/1 var(--font-mono);font-style:normal;color:var(--muted)}
.pc.p3{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pc.p2{background:var(--warn);border-color:var(--warn);color:var(--accent-ink)}
.pc.p1{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.pc.p0{background:transparent;border-style:dashed}
.lgrow{display:flex;flex-wrap:wrap;gap:10px 22px}
.lg{display:flex;align-items:center;gap:8px;font-size:.92rem}
.explain details{margin-top:2px}
.explain summary{cursor:pointer;font-weight:600}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
.pr{padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font:600 .95rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.up{border-color:var(--ok);color:var(--ok)}
.pr.dn{border-color:var(--bad);color:var(--bad)}
.ar{color:var(--muted)}
@media (max-width:560px){
  .ref.stack thead{display:none}
  .ref.stack,.ref.stack tbody,.ref.stack tr,.ref.stack td{display:block;width:100%}
  .ref.stack tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .ref.stack tr:last-child{border-bottom:0}
  .ref.stack td{border:0;padding:3px 0;min-width:0}
  .ref.stack td::before{content:attr(data-l);display:block;font:500 .66rem/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ref.stack td:first-child{font-size:1rem;padding-bottom:6px}
  .ref.stack td:first-child::before{display:none}
  .ref td{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

, 17, ?","o":["25","31","33","34","35"],"a":2,"e":"The gaps double: +1, +2, +4, +8, so the next gap is +16. 17 + 16 = 33."},{"s":"n","q":"How much simple interest does $2,000 earn at 6% per year over 3 years?","o":["$300","$340","$360","$380","$400"],"a":2,"e":"$2,000 × 0.06 = $120 per year. 3 × $120 = $360."},{"s":"n","q":"What is 3/4 of 5/6?","o":["2/3","5/8","7/12","3/5","15/16"],"a":1,"e":"Multiply across: 15/24, which reduces to 5/8."},{"s":"n","q":"A recipe uses 2.5 cups of flour for 20 cookies. How many cups are needed for 64 cookies?","o":["6.5","7","7.5","8","8.5"],"a":3,"e":"2.5 ÷ 20 = 0.125 cups per cookie. 0.125 × 64 = 8 cups."},{"s":"n","q":"What comes next?  5, 10, 8, 16, 14, 28, ?","o":["24","26","30","42","56"],"a":1,"e":"The rule alternates: ×2, then −2. After 28 (reached by ×2) comes −2, which gives 26."},{"s":"n","q":"A square has a perimeter of 36. What is its area?","o":["72","81","108","36","144"],"a":1,"e":"Each side is 36 ÷ 4 = 9. Area = 9 × 9 = 81."},{"s":"n","q":"One pipe fills a tank in 6 hours. A drain empties a full tank in 12 hours. With both open, how long to fill the empty tank?","o":["6 hours","9 hours","12 hours","18 hours","24 hours"],"a":2,"e":"Net rate = 1/6 − 1/12 = 1/12 of the tank per hour, so 12 hours."},{"s":"n","q":"Which fraction equals 0.375?","o":["3/5","3/8","5/8","1/3","7/20"],"a":1,"e":"0.375 = 375/1000 = 3/8."},{"s":"n","q":"Three consecutive whole numbers add up to 72. What is the largest?","o":["23","24","25","26","27"],"a":2,"e":"The middle number is 72 ÷ 3 = 24, so the numbers are 23, 24, 25. The largest is 25."},{"s":"n","q":"What comes next?  7, 14, 28, 56, ?","o":["56","98","104","112","126"],"a":3,"e":"Each term doubles. 56 × 2 = 112."},{"s":"n","q":"What comes next?  1, 4, 9, 16, 25, ?","o":["30","36","42","49","64"],"a":1,"e":"These are the perfect squares 1², 2², 3², 4², 5². The next is 6² = 36."},{"s":"n","q":"What comes next?  5, 7, 11, 19, 35, ?","o":["55","61","67","71","75"],"a":2,"e":"The gaps double  it removes more than the first added."},{"s":"n","q":"A $200 item goes up 10%, then goes down 10%. What is the final price?","o":["$180","$190","$198","$200","$220"],"a":2,"e":"$200 × 1.1 = $220, then $220 × 0.9 = $198. The combined multiplier is 1.1 × 0.9 = 0.99, a 1% drop."},{"s":"n","q":"A $150 coat is 20% off. An extra 25% is then taken off the sale price. What is the final price?","o":["$82.50","$90.00","$97.50","$105.00","$120.00"],"a":1,"e":"$150 × 0.80 = $120, then $120 × 0.75 = $90. That is 40% off in total, not 45%, because the second discount applies to the lower price."},{"s":"n","q":"A task takes 2 hours 45 minutes. How many hours is that as a decimal?","o":["2.45","2.50","2.75","2.80","3.45"],"a":2,"e":"45 minutes is 45 ÷ 60 = 0.75 of an hour. 2 + 0.75 = 2.75 hours."},{"s":"n","q":"A cyclist rides at 24 km/h for 50 minutes. How far does she ride?","o":["20 km","24 km","40 km","48 km","1,200 km"],"a":0,"e":"50 minutes is 5/6 of an hour. 24 × 5/6 = 20 km. Multiplying 24 by 50 (1,200) forgets to convert minutes to hours."},{"s":"n","q":"Anna can paint a room in 6 hours and Ben can paint it in 3 hours. Working together, how long do they take?","o":["1.5 hours","2 hours","3 hours","4.5 hours","9 hours"],"a":1,"e":"Add the rates: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 of the room per hour, so 2 hours. Shortcut: (6 × 3) ÷ (6 + 3) = 2. The 4.5 option is the average of 6 and 3, which does not apply."},{"s":"n","q":"A pump fills a pool in 5 hours. A drain empties a full pool in 10 hours. With both open, how long does the empty pool take to fill?","o":["5 hours","7.5 hours","10 hours","15 hours","20 hours"],"a":2,"e":"Subtract the draining rate: 1/5 − 1/10 = 2/10 − 1/10 = 1/10 of the pool per hour, so 10 hours."},{"s":"n","q":"Maya can finish a report in 8 hours. After working for 3 hours, what fraction of the report is left?","o":["5/8","3/8","1/2","3/4","7/8"],"a":0,"e":"She does 1/8 of the report each hour. After 3 hours, 3/8 is done, so 1 − 3/8 = 5/8 is left."},{ mbers is 22. One of the numbers, 12, is removed. What is the average of the other four?","o":["20","22","23","24.5","26"],"a":3,"e":"The five numbers total 5 × 22 = 110. Without 12 the total is 98. 98 ÷ 4 = 24.5."},{"s":"n","q":"Two numbers are in the ratio 2 : 3 and add up to 75. What is the smaller number?","o":["15","25","30","35","45"],"a":2,"e":"2 + 3 = 5 parts, so one part is 15. The smaller number is 2 × 15 = 30."},{"s":"n","q":"Pipe A fills a tank in 12 hours and pipe B fills it in 4 hours. Together, how long do they take?","o":["2 hours","3 hours","4 hours","6 hours","8 hours"],"a":1,"e":"Add the rates: 1/12 + 1/4 = 1/12 + 3/12 = 4/12 = 1/3 per hour, so 3 hours. Shortcut: (12 × 4) ÷ (12 + 4) = 3."},{"s":"n","q":"After a 30% increase, a price is $91. What was the price before the increase?","o":["$60","$63.70","$65","$70","$75"],"a":3,"e":"The new price is 130% of the original. $91 ÷ 1.3 = $70. Taking 30% off $91 (giving $63.70) is the common trap."},{"s":"n","q":"$1,000 is invested at 10% interest compounded annually. What is it worth after 2 years?","o":["$1,100","$1,200","$1,210","$1,220","$1,331"],"a":2,"e":"Year 1: 1,000 × 1.1 = 1,100. Year 2: 1,100 × 1.1 = 1,210. Simple interest would give only $1,200."},{"s":"n","q":"What is 2/3 ÷ 4/9?","o":["8/27","1/2","3/2","2","8/9"],"a":2,"e":"Dividing by a fraction means multiplying by its flip: 2/3 × 9/4 = 18/12 = 3/2."},{"s":"n","q":"What comes next?  2, 5, 10, 17, 26, ?","o":["35","36","37","38","40"],"a":2,"e":"The gaps are +3, +5, +7, +9, so the next gap is +11. 26 + 11 = 37. (Each term is a square plus 1.)"},{"s":"n","q":"What comes next?  3, 9, 27, 81, ?","o":["108","162","216","243","324"],"a":3,"e":"Each term is multiplied by 3. 81 × 3 = 243."},{"s":"n","q":"A car drives 150 miles in 2.5 hours. What is its average speed?","o":["50 mph","55 mph","60 mph","65 mph","75 mph"],"a":2,"e":"Speed = distance ÷ time = 150 ÷ 2.5 = 60 mph."},{"s":"n","q":"A worker earns $18 per hour and works 7.5 hours. How much do etive","Frank","Polite","Hesitant","Cheerful"],"a":1,"e":"Candid means open and honest in what you say, so frank."},{"s":"v","q":"Which word is the opposite of DILIGENT?","o":["Careful","Eager","Strict","Lazy","Clever"],"a":3,"e":"Diligent means hardworking and careful. The opposite is lazy."},{"s":"v","q":"Which word does not belong?","o":["Audit","Review","Vacation","Inspection","Examination"],"a":2,"e":"Audit, review, inspection and examination all mean checking something closely. A vacation is time off."},{"s":"v","q":"Concise is to wordy as brief is to:","o":["Short","Quick","Simple","Clear","Lengthy"],"a":4,"e":"Concise and wordy are opposites, so you need the opposite of brief, which is lengthy. Short is a synonym of brief."},{"s":"v","q":"Which word is closest in meaning to ALLEVIATE?","o":["Worsen","Relieve","Observe","Delay","Create"],"a":1,"e":"To alleviate is to make a pain or problem less severe, so to relieve it."},{"s":"v","q":"Which word is the opposite of VOLATILE?","o":["Explosive","Unpredictable","Fragile","Sudden","Stable"],"a":4,"e":"Volatile means likely to change quickly or suddenly. The opposite is stable."},{"s":"v","q":"Library is to books as bank is to:","o":["Teller","Loan","Interest","Money","Customer"],"a":3,"e":"A library holds books and a bank holds money. The link is place to what it holds."},{"s":"v","q":"Which word does not belong?","o":["Deficit","Shortfall","Shortage","Surplus","Deficiency"],"a":3,"e":"Deficit, shortfall, shortage and deficiency all mean not enough. Surplus means more than enough."},{"s":"v","q":"Although the first draft was ______, the revised version was clear and easy to follow.","o":["polished","confusing","concise","accurate","helpful"],"a":1,"e":"Although signals a contrast. The revision was clear, so the first draft must have been the opposite: confusing."},{"s":"v","q":"Because the data was incomplete, the analyst was ______ to draw firm conclusions.","o":["eager","delighted","proud","quick","reluctant"],"a":4,"e":"Incomplete data makes firm conclusions risky, so the analyst would be reluctant (unwilling) to draw them."},{"s":"v","q":"Which word is closest in meaning to REDUNDANT?","o":["Unnecessary","Essential","Brief","Valuable","Hidden"],"a":0,"e":"Redundant means more than is needed, so unnecessary."},{"s":"v","q":"Which word is the opposite of SPORADIC?","o":["Rare","Occasional","Constant","Scattered","Sudden"],"a":2,"e":"Sporadic means happening now and then. The opposite is constant."},{"s":"v","q":"Pen is to write as scissors is to:","o":["Paper","Sharp","Tailor","Cut","Metal"],"a":3,"e":"A pen is used to write and scissors are used to cut. The link is tool to purpose."},{"s":"v","q":"Which word is closest in meaning to VIGILANT?","o":["Sleepy","Angry","Watchful","Hopeful","Slow"],"a":2,"e":"Vigilant means alert and watching for problems, so watchful."},{"s":"v","q":"Which word does not belong?","o":["Honest","Truthful","Sincere","Deceitful","Candid"],"a":3,"e":"Honest, truthful, sincere and candid all describe telling the truth. Deceitful means dishonest."},{"s":"v","q":"Which word is the opposite of ENHANCE?","o":["Improve","Boost","Expand","Polish","Diminish"],"a":4,"e":"Enhance means to improve or increase. The opposite is diminish."},{"s":"v","q":"The manager's feedback was so ______ that the team knew exactly what to change.","o":["vague","lengthy","specific","cheerful","late"],"a":2,"e":"The result clause says the team knew exactly what to change, so the feedback must have been specific."},{"s":"v","q":"Which word is closest in meaning to IMPARTIAL?","o":["Fair","Biased","Silent","Friendly","Absent"],"a":0,"e":"Impartial means treating all sides equally, so fair."},{"s":"v","q":"Wheel is to car as page is to:","o":["Ink","Author","Reader","Library","Book"],"a":4,"e":"A wheel is one part of a car and a page is one part of a book. The link is part to whole."},{"s":"v","q":"Which word is closest in meaning to BENEVOLENT?","o":["Kind","Cruel","Careless","Wealthy","Shy"],"a":0,"e":"Benevolent means kind and generous, wishing to do good. The word part bene- means good."},{"s":"v","q":"Which word is the opposite of COHERENT?","o":["Logical","Clear","Confusing","Connected","Simple"],"a":2,"e":"Coherent means logical and easy to follow. The opposite is confusing."},{"s":"v","q":"Which word is closest in meaning to FEASIBLE?","o":["Costly","Obvious","Fragile","Possible","Risky"],"a":3,"e":"Feasible means able to be done, so possible."},{"s":"v","q":"Which word is the opposite of INEVITABLE?","o":["Certain","Likely","Sudden","Natural","Avoidable"],"a":4,"e":"Inevitable means certain to happen and impossible to avoid. The opposite is avoidable."},{"s":"v","q":"Which word is closest in meaning to TENTATIVE?","o":["Final","Provisional","Confident","Strong","Hurried"],"a":1,"e":"Tentative means not yet final or certain, so provisional."},{"s":"v","q":"Which word is the opposite of FLUCTUATE?","o":["Rise and fall","Increase","Stay steady","Vary","Collapse"],"a":2,"e":"To fluctuate is to rise and fall unpredictably. The opposite is to stay steady."},{"s":"v","q":"Ruler is to length as clock is to:","o":["Hour","Wall","Alarm","Minute","Time"],"a":4,"e":"A ruler measures length and a clock measures time. The link is instrument to what it measures. Hour and minute are units of time, not the thing measured."},{"s":"v","q":"Baker is to bread as author is to:","o":["Pen","Library","Book","Reader","Publisher"],"a":2,"e":"A baker makes bread and an author makes a book. The link is maker to product."},{"s":"v","q":"Drought is to rain as famine is to:","o":["Hunger","Disease","Season","Food","Poverty"],"a":3,"e":"A drought is a serious lack of rain and a famine is a serious lack of food. The link is shortage of something."},{"s":"v","q":"Which word does not belong?","o":["Prudent","Cautious","Careful","Reckless","Wary"],"a":3,"e":"Prudent, cautious, careful and wary all mean taking care to avoid risk. Reckless means ignoring risk."},{"s":"v","q":"Which word does not belong?","o":["Ledger","Audit","Invoice","Balance","Journey"],"a":4,"e":"Ledger, audit, invoice and balance are accounting terms. A journey is a trip."},{"s":"v","q":"The auditor found a ______ between the two reports, so she asked for both to be checked again.","o":["agreement","discrepancy","summary","reward","delay"],"a":1,"e":"She asked for a recheck because the reports did not match. A discrepancy is a mismatch between things that should agree."},{"s":"v","q":"The new policy is ______: employees must follow it and cannot opt out.","o":["optional","tentative","mandatory","temporary","unclear"],"a":2,"e":"Must follow and cannot opt out describes something required, so mandatory. Optional is the opposite."},{"s":"v","q":"The new rule will ______ how teams report errors.","o":["effect","reflect","infect","affect","defect"],"a":3,"e":"Affect is the verb meaning to influence. Effect is usually the noun meaning a result."},{"s":"v","q":"Her argument will ______ a strong response from the committee.","o":["illicit","explicit","implicit","complicit","elicit"],"a":4,"e":"To elicit is to draw out a response. Illicit means illegal, and it is a different word that sounds similar."},{"s":"v","q":"Which word is closest in meaning to CANDID?","o":["Secretive","Honest","Polite","Nervous","Loud"],"a":1,"e":"Candid means open and frank, so honest fits best."},{"s":"v","q":"Which word is the opposite of EXPAND?","o":["Grow","Spread","Contract","Stretch","Improve"],"a":2,"e":"To expand is to get bigger. The opposite is to contract, to get smaller."},{"s":"v","q":"Which word is closest in meaning to OBSOLETE?","o":["Modern","Outdated","Fragile","Valuable","Hidden"],"a":1,"e":"Obsolete means no longer used because something newer has replaced it, so outdated."},{"s":"v","q":"Which word is the opposite of RIGID?","o":["Strict","Flexible","Heavy","Solid","Loud"],"a":1,"e":"Rigid means stiff and unable to bend or change. The opposite is flexible."},{"s":"v","q":"Which word is closest in meaning to CONCISE?","o":["Wordy","Brief","Unclear","Complete","Careful"],"a":1,"e":"Concise means saying much in few words, so brief."},{"s":"v","q":"Which word is the opposite of ACCURATE?","o":["Exact","Correct","Flawed","Careful","Honest"],"a":2,"e":"Accurate means free from error. The opposite is flawed, or inaccurate."},{"s":"v","q":"Pilot is to airplane as captain is to:","o":["Soldier","Ship","Port","Sailor","Harbor"],"a":1,"e":"A pilot commands an airplane and a captain commands a ship. The link is person to the vehicle they command."},{"s":"v","q":"Chapter is to book as scene is to:","o":["Actor","Stage","Play","Ticket","Audience"],"a":2,"e":"A chapter is one part of a book and a scene is one part of a play. The link is part to whole."},{"s":"v","q":"Bark is to dog as roar is to:","o":["Cat","Lion","Jungle","Fear","Tiger skin"],"a":1,"e":"A dog makes the sound of a bark and a lion makes the sound of a roar. The link is the sound an animal makes."},{"s":"v","q":"Which word does not belong?","o":["Deposit","Withdraw","Transfer","Balance","Whisper"],"a":4,"e":"The other four are banking terms. Whisper is a way of speaking."},{"s":"v","q":"Which word does not belong?","o":["Hexagon","Triangle","Square","Pentagon","Cylinder"],"a":4,"e":"Hexagon, triangle, square and pentagon are flat shapes with straight sides. A cylinder is a solid shape with curved surfaces."},{"s":"v","q":"The manager praised her team's ______ attention to detail, which caught every error.","o":["careless","meticulous","occasional","reluctant","vague"],"a":1,"e":"Catching every error needs very careful attention, so meticulous fits. Careless would be the opposite."},{"s":"v","q":"Because the data was ______, the analyst could not trust any of the totals.","o":["verified","consistent","unreliable","complete","recent"],"a":2,"e":"She could not trust the totals, so the data must have been unreliable. The other words would support trust."},{"s":"v","q":"The committee will ______ the proposal before voting on it.","o":["review","revive","reveal","repeal","reward"],"a":0,"e":"Before a vote, a committee would look over the proposal, so review fits. Repeal means to cancel a law."},{"s":"v","q":"The audit confirmed that the company ______ with every regulation.","o":["complied","complimented","complicated","complained","compelled"],"a":0,"e":"To comply with a regulation is to follow it. Complimented means praised, and it only sounds similar."},{"s":"l","q":"Tom is taller than Raj. Raj is taller than Sam. Maria is shorter than Sam. Who is the shortest?","o":["Sam","Raj","Tom","Maria","Cannot be determined"],"a":3,"e":"The order from tallest is Tom, Raj, Sam, Maria."},{"s":"l","q":"All analysts are detail-oriented. Priya is an analyst. Which statement must be true?","o":["Priya is often late","Priya is detail-oriented","All detail-oriented people are analysts","Priya is not an engineer","Nothing can be concluded"],"a":1,"e":"Priya belongs to the group 'analysts', and every analyst is detail-oriented. The reverse (every detail-oriented person is an analyst) does not follow."},{"s":"l","q":"Some auditors are accountants. All accountants are careful. Which statement must be true?","o":["All auditors are careful","No auditors are careful","Some auditors are careful","All careful people are accountants","Some careful people are not auditors"],"a":2,"e":"The auditors who are accountants are careful, so at least some auditors are careful. The other statements go beyond what is given."},{"s":"l","q":"If it rains, the match is cancelled. The match was not cancelled. What follows?","o":["It rained","It did not rain","It may have rained","The match moved indoors","Cannot be determined"],"a":1,"e":"If rain always cancels the match, no cancellation means no rain (contrapositive)."},{"s":"l","q":"A finished before B. B finished before C. D finished after C. E finished before A. Who finished second?","o":["A","B","C","D","E"],"a":0,"e":"The order is E, A, B, C, D, so A is second."},{"s":"l","q":"Today is Wednesday. What day of the week will it be 100 days from now?","o":["Thursday","Friday","Saturday","Sunday","Monday"],"a":1,"e":"100 ÷ 7 leaves a remainder of 2. Two days after Wednesday is Friday."},{"s":"l","q":"In a code, CAT is written 3120. Using the same code, how is DOG written?","o":["4157","41507","4167","4147","41570"],"a":0,"e":"Letters become their alphabet positions: C=3, A=1, T=20 gives 3120. D=4, O=15, G=7 gives 4157."},{"s":"l","q":"What letter comes next?  A, C, F, J, O, ?","o":["S","T","U","V","W"],"a":2,"e":"Letter positions are 1, 3, 6, 10, 15. The gaps grow by 1, so the next gap is 6: 15 + 6 = 21, which is U."},{"s":"l","q":"What is the angle between the hour and minute hands at 4:00?","o":["90°","100°","120°","130°","150°"],"a":2,"e":"The clock face has 12 hours of 30° each. At 4:00 the hands are 4 hours apart: 4 × 30° = 120°."},{"s":"l","q":"If 3 machines make 3 widgets in 3 minutes, how long do 100 machines take to make 100 widgets?","o":["1 minute","3 minutes","30 minutes","33 minutes","100 minutes"],"a":1,"e":"Each machine makes one widget in 3 minutes. 100 machines each make one widget in the same 3 minutes."},{"s":"l","q":"Every report in the folder is approved. Some approved items are late. A report is in the folder. Is it late?","o":["Yes, it is late","No, it is not late","Cannot be determined","It is not approved","Its approval is unknown"],"a":2,"e":"The report is approved, but only some approved items are late. Nothing tells us whether this one is."},{"s":"l","q":"Which number does not belong?  16, 25, 36, 48, 49","o":["16","25","36","48","49"],"a":3,"e":"16, 25, 36 and 49 are perfect squares. 48 is not."},{"s":"l","q":"Ben is 12. Anna is twice as old as Ben. How old was Anna when Ben was born?","o":["6","10","12","18","24"],"a":2,"e":"Anna is 24 now, which is 12 years older than Ben. She was 24 − 12 = 12 when he was born."},{"s":"l","q":"A cube is painted red on all faces, then cut into 27 equal small cubes (3 × 3 × 3). How many small cubes have exactly two red faces?","o":["6","8","12","24","1"],"a":2,"e":"Cubes with two painted faces sit on the edges, excluding corners. A cube has 12 edges, with one such small cube on each."},{"s":"l","q":"Ana is older than Ben. Ben is older than Cara. Dev is younger than Cara. Who is the second oldest?","o":["Ben","Ana","Cara","Dev","Cannot be determined"],"a":0,"e":"From oldest to youngest the order is Ana, Ben, Cara, Dev. Ben is second."},{"s":"l","q":"Five runners finish a race. Lee finishes before Max. Max finishes before Noor. Olga finishes after Noor. Pat finishes before Lee. Who finishes third?","o":["Pat","Lee","Max","Noor","Olga"],"a":2,"e":"The finishing order is Pat, Lee, Max, Noor, Olga. Max finishes third."},{"s":"l","q":"If an alert is high risk, it is escalated. This alert was not escalated. What follows?","o":["It is high risk","It is low risk","It is not high risk","It was reviewed","Nothing can be concluded"],"a":2,"e":"If high risk always leads to escalation, no escalation means the alert is not high risk (the contrapositive). It could still be medium risk, so concluding 'low risk' goes too far."},{"s":"l","q":"If a transaction is flagged, it is reviewed. This transaction was reviewed. What follows?","o":["It was flagged","It was not flagged","It was approved","It may or may not have been flagged","Every transaction is flagged"],"a":3,"e":"Flagged leads to reviewed, but reviewed does not have to mean flagged. Other transactions can be reviewed too, so the flag status is unknown. Reading the rule backwards is the converse trap."},{"s":"l","q":"All managers are planners. All planners are organized. Which must be true?","o":["All organized people are planners","All managers are organized","Some managers are not planners","No planners are managers","All planners are managers"],"a":1,"e":"Chain the statements: managers are planners and planners are organized, so all managers are organized. The reverse directions do not follow."},{"s":"l","q":"No auditors are careless. Some careless people are late. Which must be true?","o":["Some late people are not auditors","No late people are auditors","Some auditors are late","All late people are careless","All auditors are late"],"a":0,"e":"Some careless people are late, and no auditor is careless. Those late, careless people cannot be auditors, so some late people are not auditors."},{"s":"l","q":"In a code, every letter is replaced by the letter two places later in the alphabet (A becomes C). How is DOG written?","o":["EPH","FQI","FPI","FQH","CNF"],"a":1,"e":"Shift each letter two places forward: D becomes F, O becomes Q, G becomes I, giving FQI."},{"s":"l","q":"What letter comes next?  B, D, G, K, P, ?","o":["T","U","V","W","X"],"a":2,"e":"The letter positions are 2, 4, 7, 11, 16. The gaps grow by 1 (+2, +3, +4, +5), so the next gap is +6. 16 + 6 = 22, which is V."},{"s":"l","q":"What is the smaller angle between the hands of a clock at 5:00?","o":["120°","135°","140°","150°","180°"],"a":3,"e":"The hour marks are 30° apart. At 5:00 the hands are 5 hours apart, and 5 × 30° = 150°."},{"s":"l","q":"Today is Monday. What day of the week will it be 45 days from today?","o":["Tuesday","Wednesday","Thursday","Friday","Saturday"],"a":2,"e":"45 ÷ 7 leaves a remainder of 3. Three days after Monday is Thursday."},{"s":"l","q":"Mia is 5 years older than her brother. In 3 years, the sum of their ages will be 31. How old is Mia now?","o":["10","13","14","15","16"],"a":3,"e":"Let the brother be b, so Mia is b + 5. In 3 years: (b + 3) + (b + 8) = 31, so 2b + 11 = 31 and b = 10. Mia is 15 now."},{"s":"l","q":"5 machines make 5 parts in 5 minutes. At the same rate, how many minutes do 10 machines need to make 100 parts?","o":["5 minutes","10 minutes","20 minutes","50 minutes","100 minutes"],"a":3,"e":"Each machine makes 1 part every 5 minutes. 10 machines make 10 parts per 5 minutes, so 100 parts take 10 rounds. 10 × 5 = 50 minutes."},{"s":"l","q":"Which number does not belong?  2, 3, 5, 9, 11","o":["2","3","5","9","11"],"a":3,"e":"2, 3, 5 and 11 are prime numbers. 9 = 3 × 3 is not."},{"s":"l","q":"Which number does not belong?  100, 8, 27, 64, 125","o":["100","8","27","64","125"],"a":0,"e":"8, 27, 64 and 125 are perfect cubes (2³, 3³, 4³, 5³). 100 is not."},{"s":"l","q":"Some clients are investors. No investors are minors. Which must be true?","o":["Some clients are not minors","All clients are investors","No clients are minors","Some minors are clients","All investors are clients"],"a":0,"e":"The clients who are investors are not minors, so at least some clients are not minors. Nothing says all clients, or no clients, are minors."},{"s":"l","q":"A courier walks 6 km north, then 8 km east. How far is she from the start in a straight line?","o":["7 km","10 km","12 km","14 km","48 km"],"a":1,"e":"The route forms a right triangle with legs 6 and 8, so the straight-line distance is 10 (a 3-4-5 triangle doubled)."},{"s":"l","q":"A person faces north, turns 90° right, turns 90° right again, then turns 90° left. Which way is she facing?","o":["North","East","South","West","Northeast"],"a":1,"e":"North, then right 90° gives east, right again gives south, and left 90° from south gives east."},{"s":"l","q":"Exactly one of three people tells the truth. Ana says: \"Ben is lying.\" Ben says: \"Cara is lying.\" Cara says: \"Ana and Ben are both lying.\" Who tells the truth?","o":["Ana","Ben","Cara","Nobody","Cannot be determined"],"a":1,"e":"Test each person as the only truth-teller. If Ben is truthful, Cara is lying, Ana's claim that Ben is lying is false, and Cara's claim that both are lying is false. Everything fits. The other two cases contradict themselves."},{"s":"l","q":"Four friends sit in a row. Sam sits to the left of Tia. Uma sits to the right of Tia. Vic sits to the left of Sam. Who sits at the far right?","o":["Vic","Sam","Tia","Uma","Cannot be determined"],"a":3,"e":"The order from left to right is Vic, Sam, Tia, Uma, so Uma is at the far right."},{"s":"l","q":"A square is divided into 16 equal small squares (a 4 × 4 grid). How many squares of any size can be found in the figure?","o":["16","20","25","30","36"],"a":3,"e":"Count by size: sixteen 1 × 1, nine 2 × 2, four 3 × 3 and one 4 × 4. 16 + 9 + 4 + 1 = 30."},{"s":"l","q":"How many squares of any size are in a 5 × 5 grid?","o":["25","30","50","55","225"],"a":3,"e":"Count by size. A k × k square fits in (5 − k + 1)² positions: 25 of size 1 × 1, 16 of size 2 × 2, 9 of size 3 × 3, 4 of size 4 × 4 and 1 of size 5 × 5. 25 + 16 + 9 + 4 + 1 = 55. The 225 option counts rectangles of every shape, which the question does not ask for."},{"s":"l","q":"A hiker walks 20 km north, 8 km south, then 16 km east. How far is she from the start in a straight line?","o":["12 km","16 km","20 km","28 km","44 km"],"a":2,"e":"North and south cancel: 20 − 8 = 12 km north. With 16 km east, the legs are 12 and 16, which is a 3-4-5 triangle times 4. The straight-line distance is 20 km. Adding all three legs (44 km) gives the distance walked, not the distance from the start."},{"s":"l","q":"Priya is 6 years older than Sam. In 4 years the sum of their ages will be 38. How old is Priya now?","o":["12","15","18","20","22"],"a":2,"e":"Let Sam be s, so Priya is s + 6. In 4 years: (s + 4) + (s + 10) = 38, so 2s + 14 = 38 and s = 12. Priya is 18 now. Shortcut: today's sum is 38 − 8 = 30, so Priya is (30 + 6) ÷ 2 = 18. The 22 option is her age in 4 years, and 12 is Sam's age now."},{"s":"l","q":"How many squares of any size are in a 3 × 3 grid?","o":["9","10","14","18","36"],"a":2,"e":"Count by size: nine 1 × 1, four 2 × 2 and one 3 × 3. 9 + 4 + 1 = 14. The 36 option counts rectangles of every shape, which the question does not ask for."},{"s":"l","q":"A grid has 4 rows and 5 columns of small squares. How many squares of any size can be found in it?","o":["20","30","38","40","50"],"a":3,"e":"A k × k square fits in (4 − k + 1) × (5 − k + 1) places. Size 1: 4 × 5 = 20. Size 2: 3 × 4 = 12. Size 3: 2 × 3 = 6. Size 4: 1 × 2 = 2. 20 + 12 + 6 + 2 = 40."},{"s":"l","q":"A cube is painted on all faces and cut into 64 equal small cubes. How many have exactly one painted face?","o":["8","16","24","32","36"],"a":2,"e":"64 = 4 × 4 × 4, so n = 4. Cubes in the middle of a face: 6 × (4 − 2) × (4 − 2) = 6 × 2 × 2 = 24."},{"s":"l","q":"A cube is painted on all faces and cut into 125 equal small cubes. How many have no paint at all?","o":["27","9","18","36","64"],"a":0,"e":"125 = 5 × 5 × 5, so n = 5. The unpainted cubes form a cube inside: (5 − 2)³ = 3 × 3 × 3 = 27."},{"s":"l","q":"A cube is painted on all faces and cut into 27 equal small cubes. How many have at least one painted face?","o":["8","20","24","26","27"],"a":3,"e":"27 = 3 × 3 × 3. Only the middle cube is unpainted, since (3 − 2)³ = 1. So 27 − 1 = 26 cubes have at least one painted face."},{"s":"l","q":"A cyclist rides 5 km west and then 12 km south. How far is she from the start in a straight line?","o":["7 km","13 km","15 km","17 km","60 km"],"a":1,"e":"The legs are 5 and 12, which is a 5-12-13 right triangle, so the straight-line distance is 13 km. Adding the legs (17 km) gives the distance ridden, not the distance from the start."},{"s":"l","q":"A runner goes 9 km east, then 3 km west, then 8 km north. How far is she from the start in a straight line?","o":["6 km","8 km","10 km","14 km","20 km"],"a":2,"e":"East and west cancel: 9 − 3 = 6 km east. With 8 km north, the legs are 6 and 8, which is a 3-4-5 triangle doubled. The distance is 10 km."},{"s":"l","q":"Tom is 4 times as old as his son. In 10 years he will be twice as old as his son. How old is the son now?","o":["2","4","5","8","10"],"a":2,"e":"Let the son be s, so Tom is 4s. In 10 years: 4s + 10 = 2 × (s + 10), so 4s + 10 = 2s + 20, which gives s = 5. Check: Tom is 20 now. In 10 years he is 30 and his son is 15."},{"s":"l","q":"A mother is 28 years older than her daughter. In 4 years she will be three times as old as her daughter. How old is the daughter now?","o":["8","10","12","14","18"],"a":1,"e":"The age gap of 28 never changes. When the mother is 3 times as old, the daughter's age is half the gap: 28 ÷ 2 = 14, and the mother is 42. That is 4 years from now, so the daughter is 14 − 4 = 10 today."},{"s":"l","q":"Today is Friday. What day of the week will it be 100 days from today?","o":["Saturday","Sunday","Monday","Tuesday","Wednesday"],"a":1,"e":"100 ÷ 7 leaves a remainder of 2. Two days after Friday is Sunday."},{"s":"l","q":"If March 3 is a Tuesday, what day of the week is March 31?","o":["Sunday","Monday","Tuesday","Wednesday","Thursday"],"a":2,"e":"March 31 is 28 days after March 3. 28 days is exactly 4 weeks, so it falls on the same day of the week: Tuesday."},{"s":"l","q":"What is the smaller angle between the hands of a clock at 3:30?","o":["15°","60°","75°","90°","105°"],"a":2,"e":"At 3:30 the minute hand points at the 6, which is 180° from the 12. The hour hand is halfway between 3 and 4, at 3.5 × 30° = 105°. The difference is 180° − 105° = 75°."},{"s":"l","q":"All alerts are logged. Some logged items are reviewed. Which must be true?","o":["All alerts are reviewed","Some alerts are reviewed","No alerts are reviewed","Some reviewed items are logged","All reviewed items are alerts"],"a":3,"e":"Some logged items are reviewed means at least one item is both logged and reviewed. That is the same as saying some reviewed items are logged. Those items might not be alerts, so none of the statements about alerts must be true."},{"s":"l","q":"Exactly one of Alex and Sam always tells the truth. Alex says: \"Sam is lying.\" Sam says: \"We both tell the truth.\" Who tells the truth?","o":["Alex","Sam","Both","Neither","Cannot be determined"],"a":0,"e":"If Sam told the truth, his statement would mean both are truthful, which contradicts \"exactly one\". So Sam is lying, and Alex's claim that Sam is lying is true."},{"s":"l","q":"If a customer is verified, the account is opened. The account was not opened. Which must be true?","o":["The customer was verified","The customer was not verified","The account is closed","The customer is a minor","Cannot be determined"],"a":1,"e":"Verified always leads to opened. If the account was not opened, the customer was not verified (the contrapositive)."},{"s":"l","q":"A is taller than B. C is taller than A. D is shorter than B. Who is the tallest?","o":["A","B","C","D","Cannot be determined"],"a":2,"e":"The order from tallest is C, A, B, D. C is the tallest."},{"s":"l","q":"How many squares of any size are in a 6 × 6 grid?","o":["36","55","72","91","140"],"a":3,"e":"Count by size: 36 + 25 + 16 + 9 + 4 + 1 = 91."},{"s":"l","q":"How many squares of any size are in a 3 × 5 grid of small squares?","o":["15","23","26","30","45"],"a":2,"e":"Size 1: 3 × 5 = 15. Size 2: 2 × 4 = 8. Size 3: 1 × 3 = 3. 15 + 8 + 3 = 26."},{"s":"l","q":"A cube is painted on all faces and cut into 64 equal small cubes. How many have exactly two painted faces?","o":["8","12","16","24","32"],"a":3,"e":"64 = 4 × 4 × 4. Each of the 12 edges has 4 − 2 = 2 such cubes. 12 × 2 = 24."},{"s":"l","q":"A cube is painted on all faces and cut into 64 equal small cubes. How many have three painted faces?","o":["4","6","8","12","24"],"a":2,"e":"Three painted faces means a corner of the big cube. Every cube has 8 corners, whatever its size."},{"s":"l","q":"A hiker walks 8 km north and then 15 km east. How far is she from the start in a straight line?","o":["17 km","19 km","21 km","23 km","120 km"],"a":0,"e":"The legs are 8 and 15, an 8-15-17 right triangle. The straight-line distance is 17 km. Adding the legs (23 km) is the distance walked."},{"s":"l","q":"A courier goes 10 km north, then 2 km south, then 6 km east. How far is he from the start in a straight line?","o":["8 km","10 km","12 km","14 km","18 km"],"a":1,"e":"North and south partly cancel: 10 − 2 = 8 km north. With 6 km east, the legs are 8 and 6, a 3-4-5 triangle doubled. The distance is 10 km."},{"s":"l","q":"Sara is twice as old as Lena. Five years ago their ages added up to 26. How old is Lena now?","o":["10","11","12","13","14"],"a":2,"e":"Let Lena be L, so Sara is 2L. Five years ago: (2L − 5) + (L − 5) = 26, so 3L − 10 = 26 and L = 12. Check: Sara is 24 now, and five years ago they were 19 and 7, which add to 26."},{"s":"l","q":"Today is Tuesday. What day of the week will it be 45 days from today?","o":["Wednesday","Thursday","Friday","Saturday","Sunday"],"a":2,"e":"45 ÷ 7 leaves a remainder of 3. Three days after Tuesday is Friday."},{"s":"l","q":"If the 5th of a month is a Saturday, what day of the week is the 20th of that month?","o":["Friday","Saturday","Sunday","Monday","Tuesday"],"a":2,"e":"The 20th is 15 days after the 5th. 15 ÷ 7 leaves a remainder of 1, so it is one day after Saturday: Sunday."},{"s":"l","q":"What is the smaller angle between the hands of a clock at 6:30?","o":["0°","15°","30°","45°","90°"],"a":1,"e":"The minute hand is at 180°. The hour hand is halfway between 6 and 7: 6.5 × 30° = 195°. The difference is 15°."},{"s":"l","q":"No managers are interns. All interns are students. Which must be true?","o":["All students are interns","No interns are managers","Some managers are students","All managers are students","No students are managers"],"a":1,"e":"\"No managers are interns\" means the two groups do not overlap, so no interns are managers. We know nothing about whether managers are students."},{"s":"l","q":"If a file is encrypted, it is safe. The file is not safe. Which must be true?","o":["The file is encrypted","The file is not encrypted","The file is deleted","The file is public","Cannot be determined"],"a":1,"e":"Encrypted always leads to safe. If the file is not safe, it cannot be encrypted (the contrapositive)."},{"s":"l","q":"If 5 machines make 5 items in 5 minutes, how long do 20 machines take to make 20 items?","o":["1 minute","4 minutes","5 minutes","20 minutes","25 minutes"],"a":2,"e":"Each machine makes one item in 5 minutes. 20 machines each make one item in the same 5 minutes."},{"s":"l","q":"What letter comes next?  C, E, H, L, Q, ?","o":["T","U","V","W","X"],"a":2,"e":"Letter positions are 3, 5, 8, 12, 17. The gaps grow by 1, so the next gap is 5: 17 + 5 = 22, which is V."},{"s":"l","q":"How many squares of any size are in a 7 × 7 grid of small squares?","o":["49","91","140","196","204"],"a":2,"e":"Add the squares of 7 down to 1: 49 + 36 + 25 + 16 + 9 + 4 + 1 = 140."},{"s":"l","q":"How many rectangles of any shape (squares included) are in a 3 × 3 grid of small squares?","o":["14","18","27","36","81"],"a":3,"e":"Pick 2 of the 4 vertical lines (6 ways) and 2 of the 4 horizontal lines (6 ways). 6 × 6 = 36. Equivalent rule: (3 × 4 ÷ 2) × (3 × 4 ÷ 2)."},{"s":"l","q":"How many rectangles of any shape (squares included) are in a 2 × 3 grid of small squares?","o":["6","12","15","18","24"],"a":3,"e":"Rows: 2 × 3 ÷ 2 = 3 ways. Columns: 3 × 4 ÷ 2 = 6 ways. 3 × 6 = 18."},{"s":"l","q":"How many rectangles that are NOT squares are in a 3 × 3 grid of small squares?","o":["14","22","27","36","50"],"a":1,"e":"There are 36 rectangles in total and 14 of them are squares. 36 − 14 = 22."},{"s":"l","q":"How many rectangles of any shape are in a 4 × 4 grid of small squares?","o":["30","64","70","100","256"],"a":3,"e":"Rows: 4 × 5 ÷ 2 = 10 ways. Columns: 10 ways. 10 × 10 = 100. This includes the 30 squares."},{"s":"l","q":"Sixteen dots are arranged in a 4 × 4 array. How many squares (upright or tilted) can be made with the dots as corners?","o":["14","16","20","30","36"],"a":2,"e":"Upright squares: 9 + 4 + 1 = 14. Tilted squares: 6 (four small tilted ones in the middle layer plus two larger). 14 + 6 = 20. Rule: n² (n² − 1) ÷ 12 = 16 × 15 ÷ 12 = 20."},{"s":"l","q":"Nine dots are arranged in a 3 × 3 array. How many squares (upright or tilted) can be made with the dots as corners?","o":["4","5","6","8","9"],"a":2,"e":"Upright: four small squares and one large square, which is 5. Tilted: one diamond joining the midpoints of the sides. 5 + 1 = 6."},{"s":"l","q":"A large triangle is divided into 9 small triangles (3 along each side). How many triangles of any size are in the figure?","o":["9","10","13","14","16"],"a":2,"e":"Size 1: 9 small triangles. Size 2: 3 upward ones. Size 3: 1 whole triangle. 9 + 3 + 1 = 13."},{"s":"l","q":"A large triangle is divided into 16 small triangles (4 along each side). How many triangles of any size are in the figure?","o":["16","20","24","27","30"],"a":3,"e":"Upward triangles: 10 + 6 + 3 + 1 = 20. Downward triangles: 6 of size 1 and 1 of size 2, which is 7. 20 + 7 = 27."},{"s":"l","q":"How many squares of any size are in a 2 × 4 grid of small squares?","o":["8","10","11","14","20"],"a":2,"e":"Size 1: 2 × 4 = 8. Size 2: 1 × 3 = 3. 8 + 3 = 11. A 3 × 3 square does not fit because the grid has only 2 rows."},{"s":"s","q":"Which option shows the shape in the grey box after it is turned (any amount: quarter, half or three-quarter turn), with no flipping?","g":"<div class=\"stemfig\"><svg class=\"sp\" xmlns=\"http://www.w3.org/2000/svg\" width=\"62\" height=\"62\" viewBox=\"-1 -1 62 62\" role=\"img\" aria-label=\"original shape\"><rect x=\"0\" y=\"0\" width=\"60\" height=\"60\" fill=\"none\" stroke=\"currentColor\" stroke-opacity=\".35\"/><path d=\"M15 0V60 M0 15H60\" stroke=\"currentColor\" stroke-opacity=\".15\"/><path d=\"M30 0V60 M0 30H60\" stroke=\"currentColor\" stroke-opacity=\".15\"/><path d=\"M45 0V60 M0 45H60\" stroke=\"currentColor\" stroke-opacity=\".15\"/><rect x=\"1\" y=\"16\" width=\"13\" height=\"13\" fill=\"currentColor\"/><rect x=\"1\" y=\"31\" width=\"13\" height=\"13\" fill=\"currentColor\"/><rect x=\"16\" y=\"1\" width=\"13\" height=\"13\" fill=\"currentColor\"/><rect x=\"16\" y=\"16\" width=\"13\" height=\"13\" fill=\"currentColor\"/><rect x=\"31\" y=\"1\" width=\"13\" height=\"13\" fill=\"currentColor\"/><rect x=\"31\" y=\"16\" width=\"13\" height=\"13\" fill=\"currentColor\"/>< var SECTIONS = {n:'Numerical', v:'Verbal', l:'Logic', s:'Spatial'};
function isSvg(t){return String(t).indexOf('<svg')===0}
function optHtml(t){return isSvg(t)?t:esc(t)}
function ansText(q){return isSvg(q.o[q.a])?'Option '+LET[q.a]:esc(q.o[q.a])}
var MODES = {
  full:{name:'Full test', secs:900, mix:{n:16,v:14,l:12,s:8}, big:'15:00', sub:'50 questions drawn at random, about 18 seconds each'},
  half:{name:'Half test', secs:450, mix:{n:8,v:7,l:6,s:4}, big:'7:30', sub:'25 questions, same pace as the full test'},
  free:{name:'Untimed practice', secs:0, mix:{n:16,v:14,l:12,s:8}, big:'No clock', sub:'50 questions, elapsed time still tracked'},
  dn:{name:'Math drill', secs:0, only:'n'},
  dv:{name:'Verbal drill', secs:0, only:'v'},
  dl:{name:'Logic drill', secs:0, only:'l'},
  ds:{name:'Spatial drill', secs:0, only:'s'}
};
function countOf(s){return Q.filter(function(q){return q.s===s}).length}
function modeCount(m){return m.only ? countOf(m.only) : (m.mix.n||0)+(m.mix.v||0)+(m.mix.l||0)+(m.mix.s||0)}
function modeCard(k){
  var m=MODES[k], c=modeCount(m);
  var big=m.only?String(c):m.big, sub=m.only?('All '+c+' '+SECTIONS[m.only].toLowerCase()+' questions, no clock'):m.sub;
  return '<button class="mode" data-a="mode" data-m="'+k+'"><span class="big">'+big+'</span><span class="name">'+m.name+'</span><span class="sub">'+sub+'</span></button>';
}
var LET = ['A','B','C','D','E'];
var HKEY = 'ccat-practice-history';
function $(s){return document.querySelector(s)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s}
function isRight(it){return it.pick!==null && it.opts[it.pick].c}
function loadHistory(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch(e){return []}}
function saveHistory(score){try{var h=loadHistory();h.unshift({d:Date.now(),m:S.mode,s:score,n:S.items.length});localStorage.setItem(HKEY,JSON.stringify(h.slice(0,6)))}catch(e){}}

var S = null, timer = null, ui = {view:'start', tab:'practice', filter:'all', kf:'all', tf:'all', confirm:false, auto:false};

function newAttempt(modeKey){
  var m = MODES[modeKey], pool = [];
  ['n','v','l','s'].forEach(function(s){
    var want = m.only ? (m.only===s ? Infinity : 0) : (m.mix[s]||0);
    if(!want)return;
    pool = pool.concat(shuffle(Q.filter(function(q){return q.s===s})).slice(0, want===Infinity?undefined:want));
  });
  var items = shuffle(pool).map(function(q){
    return {id:Q.indexOf(q)+1, s:q.s, q:q.q, g:q.g||'', e:q.e, pick:null, flag:false, ms:0,
      opts:shuffle(q.o.map(function(t,i){return {t:t, c:i===q.a}}))};
  });
  var now = Date.now();
  S = {mode:modeKey, items:items, cur:0, startTs:now, endTs:m.secs?now+m.secs*1000:0, qStart:now, done:false, timeUp:false, usedSec:0};
  ui.view='test'; ui.tab='practice'; ui.confirm=false;
  clearInterval(timer); timer=setInterval(tick,250);
  render(); window.scrollTo(0,0);
}
function leave(){S.items[S.cur].ms += Date.now()-S.qStart}
function go(i){
  if(i<0||i>=S.items.length)return;
  leave(); S.cur=i; S.qStart=Date.now(); ui.confirm=false; render();
}
function choose(i){
  var it=S.items[S.cur]; if(i>=it.opts.length)return;
  it.pick=i;
  if(ui.auto && S.cur<S.items.length-1) go(S.cur+1); else render();
}
function finish(auto){
  if(S.done)return;
  leave(); S.done=true; S.timeUp=!!auto;
  var end = S.endTs ? Math.min(Date.now(), S.endTs) : Date.now();
  S.usedSec = (end-S.startTs)/1000;
  clearInterval(timer);
  saveHistory(S.items.filter(isRight).length);
  ui.view='results'; ui.filter='all'; ui.confirm=false;
  render(); window.scrollTo(0,0);
}
function tick(){
  if(!S||S.done)return;
  var el=$('#clock');
  if(S.endTs){
    var r=(S.endTs-Date.now())/1000;
    if(r<=0){finish(true);return}
    if(el){el.textContent=fmt(Math.ceil(r)); el.parentElement.classList.toggle('low', r<=120)}
  } else if(el){ el.textContent=fmt((Date.now()-S.startTs)/1000) }
}

function renderStart(){
  var h=loadHistory();
  var hist = h.length ? '<section class="hist"><h2>Your recent attempts on this device</h2><table><thead><tr><th>Date</th><th>Mode</th><th>Score</th></tr></thead><tbody>'+
    h.map(function(x){return '<tr><td>'+esc(new Date(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'</td><td>'+esc(MODES[x.m]?MODES[x.m].name:x.m)+'</td><td class="mono">'+x.s+' / '+x.n+'</td></tr>'}).join('')+
    '</tbody></table></section>' : '';
  return '<div class="hero"><span class="eyebrow">Criteria Cognitive Aptitude Test · practice</span>'+
    '<h1>CCAT Practice Test</h1>'+
    '<p class="lede">'+Q.length+' original questions in the style of the CCAT: numerical, verbal, logic and spatial. Full tests draw 50 of them at random, so every retake is different. Pick a mode, race the clock, then review every answer with a short explanation.</p></div>'+
    '<h2 class="grp">Full-length practice</h2><div class="modes">'+['full','half','free'].map(modeCard).join('')+'</div>'+
    '<h2 class="grp">Practise one section</h2><div class="modes">'+['dn','dv','dl','ds'].map(modeCard).join('')+'</div>'+
    '<p class="note">Coinbase describes a structured assessment of about 30 minutes covering logical, spatial, verbal and mathematical reasoning, while Criteria describes the CCAT as 50 questions in 15 minutes. Treat your invitation email as the source of truth for your time limit. This set is for building speed, not for predicting a percentile.</p>'+
    '<div class="tips">'+
    '<section class="card"><h2>How the real test works</h2><ul>'+
      '<li>Criteria describes the CCAT as <strong>50 questions in 15 minutes</strong>, about 18 seconds each, and says fewer than 1% of candidates answer all 50. The Coinbase page says its assessment takes about 30 minutes, so check your invitation for the exact format.</li>'+
      '<li>Criteria lists three question types: <strong>verbal</strong> (word meanings, relationships, word choice), <strong>math and logic</strong> (basic algebra, proportions, word problems, no calculator) and <strong>spatial reasoning</strong> (rotating or flipping shapes, patterns, outliers). This set covers all three.</li>'+
      '<li>Criteria says wrong answers are not penalized, so guess rather than leave a blank. Confirm this in your own instructions.</li>'+
      '<li>Check whether scratch paper and a calculator are allowed. Practise without a calculator either way, because 18 seconds leaves no time for one.</li>'+
      '<li>Prep sites often quote an average of about 24 correct out of 50. I could not confirm that figure with Criteria, and employers set their own cut-offs, so do not rely on it.</li>'+
    '</ul></section>'+
    '<section class="card"><h2>Tricks for a higher score</h2><ul>'+
      '<li><strong>Work in two passes.</strong> Answer what you can in 10 to 15 seconds. Guess, flag and move on from anything that stalls you. The Criteria advice is to make your best guess after about a minute on one problem; with 18 seconds each, many people move on much sooner.</li>'+
      '<li><strong>Never leave a blank.</strong> A blind guess is 1 in 5. Cross out two options and it becomes 1 in 3.</li>'+
      '<li><strong>Estimate before you calculate.</strong> Round the numbers, then pick the closest option. Last digits often rule out options.</li>'+
      '<li><strong>Run the same checks on every sequence.</strong> Differences first, then ratios, then alternating rules, then squares and Fibonacci.</li>'+
      '<li><strong>Turn analogies into a sentence.</strong> Say how the first pair connects, such as "a doctor treats a patient", then apply it to the second pair. For odd one out, name the category first.</li>'+
      '<li><strong>Read logic literally.</strong> "Some" never means "all". "If A then B" plus "not B" gives "not A", but "B" does not give "A". When the facts leave a gap, "cannot be determined" is often right.</li>'+
      '<li><strong>Build percentages from 10%, 5% and 1%.</strong> They combine into almost any percentage.</li>'+
      '<li><strong>Practise under the clock.</strong> Do the full mode two or three times, then use the review to see which section costs you the most time or points.</li>'+
    '</ul></section></div>'+hist+
    '<p class="foot">Keyboard shortcuts during the test: A to E or 1 to 5 to answer, N next, P previous, F flag. All '+Q.length+' questions are original practice items written for this page. They match the style of the CCAT, not its content.</p>';
}

function renderTest(){
  var it=S.items[S.cur], n=S.items.length, m=MODES[S.mode];
  var ans=S.items.filter(function(x){return x.pick!==null}).length;
  var fl=S.items.filter(function(x){return x.flag}).length;
  var blank=n-ans;
  var clockTxt = S.endTs ? fmt(Math.ceil((S.endTs-Date.now())/1000)) : fmt((Date.now()-S.startTs)/1000);
  var dots = S.items.map(function(x,i){
    var c=(x.pick!==null?' ans':'')+(x.flag?' fl':'')+(i===S.cur?' cur':'');
    return '<button class="dot'+c+'" data-a="go" data-i="'+i+'" aria-label="Question '+(i+1)+(x.pick!==null?', answered':', blank')+(x.flag?', flagged':'')+'"'+(i===S.cur?' aria-current="true"':'')+'>'+(i+1)+'</button>';
  }).join('');
  var finishBox = ui.confirm ?
    '<div class="confirm" role="alertdialog" aria-label="Submit test"><p>'+(blank?blank+' unanswered':'All answered')+(fl?', '+fl+' flagged':'')+'. Submit now?</p><div class="row"><button class="btn" data-a="cancel">Keep working</button><button class="btn primary" data-a="submit">Submit</button></div></div>' :
    '<button class="btn primary wide" data-a="ask">Finish and see score</button>';
  return '<header class="bar"><div class="bar-in">'+
      '<div class="qcount"><strong>Question '+(S.cur+1)+'</strong> of '+n+'</div>'+
      '<div class="prog" role="progressbar" aria-label="Answered" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+ans+'"><i style="width:'+(ans/n*100)+'%"></i></div>'+
      '<div class="clock"><span class="lbl">'+(S.endTs?'Time left':'Elapsed')+'</span><span id="clock" class="mono">'+clockTxt+'</span></div>'+
    '</div></header>'+
    '<div class="test-grid">'+
    '<section class="card qcard"><div class="qmeta"><span class="chip">'+SECTIONS[it.s]+'</span><span class="chip" title="Number in the Answer key tab">Key Q'+it.id+'</span>'+(it.flag?'<span class="chip flag">Flagged</span>':'')+'</div>'+
      '<h2 class="qtext">'+esc(it.q)+'</h2>'+(it.g?it.g:'')+
      '<div class="opts" role="radiogroup" aria-label="Answer choices">'+
        it.opts.map(function(o,i){return '<button class="opt'+(it.pick===i?' sel':'')+'" role="radio" aria-checked="'+(it.pick===i)+'" data-a="pick" data-i="'+i+'"><span class="key">'+LET[i]+'</span><span class="otext">'+optHtml(o.t)+'</span></button>'}).join('')+
      '</div>'+
      '<div class="qnav"><button class="btn" data-a="prev"'+(S.cur===0?' disabled':'')+'>Previous</button>'+
        '<button class="btn" data-a="flag" aria-pressed="'+it.flag+'">'+(it.flag?'Remove flag':'Flag for later')+'</button><span class="grow"></span>'+
        (S.cur===n-1?'<button class="btn primary" data-a="ask">Finish</button>':'<button class="btn primary" data-a="next">Next</button>')+
      '</div></section>'+
    '<aside class="card side"><h2>Questions</h2><p class="tally">'+ans+' answered · '+fl+' flagged · '+blank+' blank</p>'+
      '<div class="navgrid">'+dots+'</div>'+
      '<div class="legend"><span class="l-ans">Answered</span><span class="l-fl">Flagged</span></div>'+
      '<label class="auto"><input type="checkbox" id="auto"'+(ui.auto?' checked':'')+'> Move on after I answer</label>'+
      finishBox+
    '</aside></div>';
}

function renderResults(){
  var items=S.items, n=items.length;
  var correct=items.filter(isRight).length;
  var blank=items.filter(function(x){return x.pick===null}).length;
  var wrong=n-correct-blank;
  var pct=Math.round(correct/n*100);
  var avg=S.usedSec/n;
  var secs=['n','v','l','s'].map(function(k){
    var g=items.filter(function(x){return x.s===k});
    var c=g.filter(isRight).length;
    var t=g.reduce(function(a,x){return a+x.ms},0)/g.length/1000;
    return {k:k,total:g.length,c:c,t:t,acc:c/g.length};
  }).filter(function(s){return s.total>0});
  var weakest=secs.slice().sort(function(a,b){return a.acc-b.acc})[0];
  var slowest=secs.slice().sort(function(a,b){return b.t-a.t})[0];
  var pace = avg>18 ? 'You averaged <strong>'+avg.toFixed(0)+' seconds</strong> per question against a target of 18. Skip faster and come back later.' :
    'You averaged <strong>'+avg.toFixed(0)+' seconds</strong> per question, inside the 18 second target.';
  var coach = pace+' Accuracy was lowest on <strong>'+SECTIONS[weakest.k].toLowerCase()+'</strong> questions ('+weakest.c+' of '+weakest.total+')'+
    (slowest.k!==weakest.k?', and you spent the most time per question on <strong>'+SECTIONS[slowest.k].toLowerCase()+'</strong>':'')+'. Aim your next set there.';
  if(secs.length===1){coach=pace+' You got <strong>'+secs[0].c+' of '+secs[0].total+'</strong> '+SECTIONS[secs[0].k].toLowerCase()+' questions right.'}
  var f=ui.filter;
  var counts={all:n,wrong:wrong,blank:blank,flag:items.filter(function(x){return x.flag}).length};
  var seg=[['all','All'],['wrong','Wrong'],['blank','Blank'],['flag','Flagged']].map(function(p){
    return '<button data-a="filter" data-f="'+p[0]+'" aria-pressed="'+(f===p[0])+'">'+p[1]+' ('+counts[p[0]]+')</button>';
  }).join('');
  var rows=items.map(function(it,i){
    var ok=isRight(it), bl=it.pick===null;
    if(f==='wrong' && (ok||bl))return '';
    if(f==='blank' && !bl)return '';
    if(f==='flag' && !it.flag)return '';
    var opts=it.opts.map(function(o,j){
      var cls=o.c?'ok':(it.pick===j?'bad':'');
      var mk=o.c?'✓':(it.pick===j?'✗':'');
      var tag=o.c?(it.pick===j?'Your answer':'Correct'):(it.pick===j?'Your answer':'');
      return '<div class="'+cls+'"><span class="mk">'+mk+'</span><span>'+optHtml(o.t)+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';
    }).join('');
    return '<article class="card rv"><div class="rv-top"><span class="st '+(ok?'ok':bl?'blank':'bad')+'">'+(ok?'Correct':bl?'Blank':'Wrong')+'</span>'+
      '<span class="qn">Question '+(i+1)+' · '+SECTIONS[it.s]+' · Key Q'+it.id+(it.flag?' · flagged':'')+'</span><span class="t mono">'+(it.ms/1000).toFixed(0)+'s</span></div>'+
      '<p class="q">'+esc(it.q)+'</p>'+(it.g||'')+'<div class="ro">'+opts+'</div><p class="exp"><b>Why:</b> '+esc(it.e)+'</p></article>';
  }).join('') || '<p class="note">Nothing in this filter.</p>';
  return (S.timeUp?'<div class="banner" role="status">Time ran out. Your answers so far were scored.</div>':'')+
    '<span class="eyebrow">'+MODES[S.mode].name+' · results</span>'+
    '<div class="res-top"><div><div class="score"><span class="num">'+correct+'</span><span class="of">/ '+n+'</span></div><p class="pct">'+pct+'% correct</p></div>'+
      '<dl class="stats"><div class="stat"><dt>Wrong</dt><dd>'+wrong+'</dd></div><div class="stat"><dt>Blank</dt><dd>'+blank+'</dd></div><div class="stat"><dt>Time used</dt><dd>'+fmt(S.usedSec)+'</dd></div><div class="stat"><dt>Per question</dt><dd>'+avg.toFixed(0)+'s</dd></div></dl></div>'+
    '<section class="card"><h2 style="font-size:1.15rem;margin-bottom:14px">By section</h2><div class="secs">'+
      secs.map(function(s){return '<div class="srow"><span class="nm">'+SECTIONS[s.k]+'</span><span class="track"><i style="width:'+(s.acc*100)+'%"></i></span><span class="sc mono">'+s.c+' / '+s.total+'</span><span class="tm mono">'+s.t.toFixed(0)+'s each</span></div>'}).join('')+
    '</div><p class="coach">'+coach+'</p></section>'+
    '<div class="res-actions"><button class="btn primary" data-a="retry">Retake '+MODES[S.mode].name.toLowerCase()+'</button><button class="btn" data-a="home">Choose another mode</button></div>'+
    '<div class="rv-head"><h2>Review every answer</h2><div class="seg">'+seg+'</div></div>'+rows+
    '<p class="foot">Retaking reshuffles question order and answer positions, so memorising letters will not help. Scores here are not calibrated against the real test.</p>';
}

/* ---------- answer key ---------- */
function renderKey(){
  var f=ui.kf;
  var cnt={all:Q.length,n:0,v:0,l:0,s:0};
  Q.forEach(function(q){cnt[q.s]++});
  var seg=[['all','All'],['n','Numerical'],['v','Verbal'],['l','Logic'],['s','Spatial']].map(function(p){
    return '<button data-a="kfilter" data-f="'+p[0]+'" aria-pressed="'+(f===p[0])+'">'+p[1]+' ('+cnt[p[0]]+')</button>';
  }).join('');
  var quick=Q.map(function(q,i){
    if(f!=='all'&&q.s!==f)return '';
    return '<li><b>'+(i+1)+'</b><span>'+ansText(q)+'</span></li>';

   '<h4>Example: +20% then −20%</h4>'+
   '<ol class="steps">'+
    '<li><strong>Start with $100.</strong> It makes the percentages easy to read.</li>'+
    '<li><strong>+20%.</strong> 20% of 100 is 20, so the price becomes 100 + 20 = <b>$120</b>.</li>'+
    '<li><strong>−20%.</strong> This 20% comes off the new price of $120. 20% of 120 is 24, so the price becomes 120 − 24 = <b>$96</b>.</li>'+
    '<li><strong>Compare.</strong> $96 is $4 below the start of $100, so the net change is a <b>4% drop</b>.</li>'+
   '</ol>'+f1+
   '<p>The price did not return to $100 because the rise added $20 but the fall took away $24. The second 20% was taken from a bigger number.</p>'+
   '<h4>The multiplier shortcut</h4>'+
   '<ul class="steps">'+
    '<li><strong>Add p%:</strong> multiply by 1 + p/100. So +20% is × 1.2.</li>'+

    '<li><strong>Two changes in a row:</strong> multiply the multipliers. 1.2 × 0.8 = 0.96.</li>'+
    '<li><strong>Net change:</strong> subtract 1 from the answer. 0.96 − 1 = −0.04, which is a 4% drop.</li>'+
    '<li><strong>Order does not matter.</strong> −20% then +20% gives 100 → 80 → 96, the same result.</li>'+
   '</ul>'+
   '<h4>More examples, starting from $100</h4>'+

   '<ul class="steps">'+

    '<li><strong>Two discounts do not add.</strong> An $80 jacket that is 25% off, then 10% off the sale price, costs $54. That is 0.75 × 0.9 = 0.675, which is 32.5% off in total, not 35%.</li>'+
